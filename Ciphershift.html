<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CipherShift</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111827;
        color: #f3f4f6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    .game {
        width: 100%;
        max-width: 700px;
    }

    h1 {
        text-align: center;
        margin-bottom: 5px;
        font-size: 3rem;
    }

    .subtitle {
        text-align: center;
        color: #9ca3af;
        margin-bottom: 30px;
    }

    .board {
        display: grid;
        gap: 12px;
        margin-bottom: 25px;
    }

    .row {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
    }

    .tile {
        aspect-ratio: 1;
        border-radius: 12px;
        background: #1f2937;
        border: 2px solid #374151;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 2rem;
        font-weight: bold;
        text-transform: uppercase;
        transition: 0.2s;
    }

    .correct {
        background: #16a34a;
        border-color: #16a34a;
    }

    .close {
        background: #ca8a04;
        border-color: #ca8a04;
    }

    .wrong {
        background: #374151;
        border-color: #374151;
    }

    .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }

    input {
        flex: 1;
        padding: 14px;
        font-size: 1.2rem;
        border-radius: 10px;
        border: none;
        outline: none;
        text-transform: uppercase;
    }

    button {
        padding: 14px 20px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }

    .hintbox {
        background: #1f2937;
        padding: 20px;
        border-radius: 15px;
        margin-top: 15px;
    }

    .hintbox h3 {
        margin-top: 0;
    }

    .semantic-bar {
        height: 18px;
        border-radius: 10px;
        overflow: hidden;
        background: #374151;
        margin-top: 8px;
    }

    .semantic-fill {
        height: 100%;
        background: linear-gradient(90deg,#f59e0b,#22c55e);
        width: 0%;
        transition: 0.4s;
    }

    .message {
        text-align: center;
        margin-top: 20px;
        font-size: 1.3rem;
        font-weight: bold;
    }

    .footer {
        text-align: center;
        margin-top: 30px;
        color: #9ca3af;
        font-size: 0.9rem;
    }
</style>
</head>
<body>

<div class="game">

    <h1>CipherShift</h1>
    <div class="subtitle">
        Guess the hidden concept word.
    </div>

    <div class="board" id="board"></div>

    <div class="controls">
        <input id="guessInput" maxlength="5" placeholder="ENTER WORD"/>
        <button onclick="submitGuess()">Guess</button>
    </div>

    <div class="hintbox">
        <h3>Meaning Signal</h3>

        <div id="semanticText">
            No guesses yet.
        </div>

        <div class="semantic-bar">
            <div class="semantic-fill" id="semanticFill"></div>
        </div>

        <div style="margin-top:15px;">
            <strong>Hint:</strong>
            <span id="hintText">Think about power, systems, or organisation.</span>
        </div>
    </div>

    <div class="message" id="message"></div>

    <div class="footer">
        Inspired by Wordle, but focused on meaning and interpretation.
    </div>

</div>

<script>

const answer = "STATE";

const semanticGroups = {
    STATE: ["POWER", "CROWN", "ORDER", "RULES", "GOVT"],
};

const board = document.getElementById("board");
const input = document.getElementById("guessInput");
const message = document.getElementById("message");
const semanticText = document.getElementById("semanticText");
const semanticFill = document.getElementById("semanticFill");
const hintText = document.getElementById("hintText");

let guesses = [];

function buildBoard() {
    board.innerHTML = "";

    for (let r = 0; r < 6; r++) {

        const row = document.createElement("div");
        row.className = "row";

        const guess = guesses[r] || "";

        for (let c = 0; c < 5; c++) {

            const tile = document.createElement("div");
            tile.className = "tile";

            const letter = guess[c] || "";
            tile.textContent = letter;

            if (guess) {

                if (letter === answer[c]) {
                    tile.classList.add("correct");
                }
                else if (answer.includes(letter)) {
                    tile.classList.add("close");
                }
                else {
                    tile.classList.add("wrong");
                }
            }

            row.appendChild(tile);
        }

        board.appendChild(row);
    }
}

function semanticScore(word) {

    if (word === answer) {
        return 100;
    }

    const closeWords = semanticGroups.STATE;

    if (closeWords.includes(word)) {
        return 75;
    }

    let shared = 0;

    for (let letter of word) {
        if (answer.includes(letter)) {
            shared++;
        }
    }

    return Math.min(60, shared * 15);
}

function semanticHint(score) {

    if (score >= 90) return "Extremely close conceptually.";
    if (score >= 70) return "Strong institutional connection.";
    if (score >= 50) return "Some overlap in meaning.";
    if (score >= 30) return "Weak association detected.";
    return "Little conceptual similarity.";
}

function submitGuess() {

    const guess = input.value.toUpperCase().trim();

    if (guess.length !== 5) {
        alert("Enter a 5-letter word.");
        return;
    }

    if (guesses.length >= 6) {
        return;
    }

    guesses.push(guess);

    buildBoard();

    const score = semanticScore(guess);

    semanticText.innerHTML =
        "<strong>Semantic Match:</strong> " + score + "%<br>" +
        semanticHint(score);

    semanticFill.style.width = score + "%";

    if (score >= 70) {
        hintText.textContent = "You are near governance, authority, or structure.";
    }

    if (guess === answer) {

        message.innerHTML =
            "Solved in " + guesses.length + " guesses.";

        input.disabled = true;
    }
    else if (guesses.length >= 6) {

        message.innerHTML =
            "Game Over. The word was: " + answer;

        input.disabled = true;
    }

    input.value = "";
}

input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        submitGuess();
    }
});

buildBoard();

</script>

</body>
</html>
