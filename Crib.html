<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cribbage (Full 2-Player) vs AI</title>
  <style>
    :root{
      --bg0:#070912;
      --bg1:#0b1020;
      --card:#101a33cc;
      --card2:#0d142acc;
      --ink:#e9eefc;
      --muted:#aeb8da;
      --accent:#7aa7ff;
      --good:#7dffb2;
      --warn:#ffcc66;
      --bad:#ff6b88;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --r:16px;
      --tap:48px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 700px at 30% -10%, #18204a, transparent 60%),
                  radial-gradient(1000px 700px at 90% 20%, #1a4a3a, transparent 55%),
                  linear-gradient(180deg, var(--bg0), var(--bg1));
      color:var(--ink);
      min-height:100vh;
      display:flex;
      justify-content:center;
    }
    .app{
      width:min(980px, 100%);
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .top{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .panel{
      background: linear-gradient(180deg, var(--card), var(--card2));
      border:1px solid rgba(255,255,255,.08);
      border-radius:var(--r);
      box-shadow:var(--shadow);
      padding:10px;
    }
    .scorePanel{flex: 1 1 360px}
    .statusPanel{flex: 2 1 420px}
    .actionsPanel{flex: 1 1 200px; display:flex; flex-direction:column; gap:8px}

    .row{display:flex; align-items:center; justify-content:space-between; gap:10px}
    .k{color:var(--muted); font-size:12px}
    .v{font-weight:700}
    .small{font-size:12px; color:var(--muted)}
    .badge{
      display:inline-flex; align-items:center; gap:6px;
      padding:6px 10px;
      border-radius:999px;
      background: rgba(122,167,255,.15);
      border:1px solid rgba(122,167,255,.25);
      font-size:12px;
      white-space:nowrap;
    }
    .badge.good{background: rgba(125,255,178,.14); border-color: rgba(125,255,178,.25)}
    .badge.warn{background: rgba(255,204,102,.14); border-color: rgba(255,204,102,.25)}
    .badge.bad{background: rgba(255,107,136,.14); border-color: rgba(255,107,136,.25)}

    .progressWrap{margin-top:8px; display:grid; gap:8px}
    .progressRow{display:grid; grid-template-columns: 64px 1fr 44px; gap:10px; align-items:center}
    .bar{
      height:12px;
      border-radius:999px;
      background: rgba(255,255,255,.06);
      overflow:hidden;
      border:1px solid rgba(255,255,255,.08);
    }
    .bar > i{display:block; height:100%; background: linear-gradient(90deg, rgba(122,167,255,.9), rgba(125,255,178,.9)); width:0%}
    .bar.ai > i{background: linear-gradient(90deg, rgba(255,204,102,.9), rgba(255,107,136,.9))}
    button{
      height:var(--tap);
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color:var(--ink);
      cursor:pointer;
      font-weight:700;
      padding:0 12px;
    }
    button.primary{
      background: rgba(122,167,255,.22);
      border-color: rgba(122,167,255,.35);
    }
    button.good{
      background: rgba(125,255,178,.18);
      border-color: rgba(125,255,178,.30);
    }
    button.bad{
      background: rgba(255,107,136,.16);
      border-color: rgba(255,107,136,.28);
    }
    button:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .mid{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .tablePanel{flex: 2 1 520px}
    .logPanel{flex: 1 1 260px; max-height: 340px; overflow:auto}

    .tableGrid{
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
    }
    .pileRow{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }
    .pile{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width: 180px;
      flex: 1 1 180px;
    }
    .pileTitle{display:flex; align-items:center; justify-content:space-between; gap:10px}
    .cardsLine{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
      min-height:56px;
    }

    .cardEl{
      width:44px;
      height:56px;
      border-radius:12px;
      background: rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.12);
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding:6px;
      box-shadow: 0 6px 18px rgba(0,0,0,.28);
      user-select:none;
      touch-action: manipulation;
    }
