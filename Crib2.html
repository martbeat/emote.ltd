<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cribbage 121 (Mobile) vs AI</title>
  <style>
    :root{
      --bg:#0b1020;
      --panel:#111a33;
      --panel2:#0f1730;
      --ink:#eaf0ff;
      --muted:#b7c4ff;
      --accent:#7aa7ff;
      --good:#7dffb2;
      --bad:#ff6b88;
      --warn:#ffd56b;
      --line:#223059;
      --shadow: 0 10px 28px rgba(0,0,0,.35);
      --r:16px;
      --tap:48px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background: radial-gradient(1200px 700px at 40% 10%, #162251 0%, var(--bg) 55%, #060912 100%);
      color:var(--ink);
      -webkit-tap-highlight-color: transparent;
    }
    .wrap{
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px;
      display:flex;
      flex-direction:column;
      gap: 10px;
      min-height:100%;
    }
    header{
      display:flex;
      gap:10px;
      align-items:stretch;
      justify-content:space-between;
      flex-wrap:wrap;
    }
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.10);
      box-shadow: var(--shadow);
      border-radius: var(--r);
      padding: 12px;
    }
    .title{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width: 240px;
      flex: 1;
    }
    .title h1{
      font-size: 18px;
      margin:0;
      letter-spacing:.2px;
    }
    .title .sub{
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .controls{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
      justify-content:flex-end;
      min-width: 260px;
    }
    button, .toggle{
      height: var(--tap);
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--ink);
      padding: 0 14px;
      font-weight: 650;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      user-select:none;
    }
    button:hover{background: rgba(255,255,255,.09)}
    button:active{transform: translateY(1px)}
    button.primary{
      background: rgba(122,167,255,.18);
      border-color: rgba(122,167,255,.35);
    }
    button.primary:hover{background: rgba(122,167,255,.24)}
    button.danger{
      background: rgba(255,107,136,.14);
      border-color: rgba(255,107,136,.35);
    }
    button.good{
      background: rgba(125,255,178,.12);
      border-color: rgba(125,255,178,.32);
    }
    button:disabled{
      opacity:.45;
      cursor:not-allowed;
      transform:none;
    }
    .toggle{
      padding: 0 10px;
      gap:10px;
    }
    .toggle input{width:20px; height:20px}
    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 920px){
      .grid{grid-template-columns: 1.2fr .8fr}
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:stretch;
    }
    .col{
      flex:1;
      min-width: 260px;
    }

    .sectionTitle{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }
    .sectionTitle h2{
      margin:0;
      font-size: 14px;
      letter-spacing:.3px;
      color: var(--muted);
      font-weight: 750;
      text-transform: uppercase;
    }
    .pill{
      font-size: 12px;
      padding: 6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.18);
      color: var(--muted);
      white-space:nowrap;
    }

    .cards{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .playingCard{
      width: 56px;
      height: 76px;
      border-radius: 12px;
      border:1px solid rgba(255,255,255,.14);
      background:
