<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Dominoes vs AI – Snake Layout</title>

<style>
:root{
  --bg:#0b1020;
  --panel:#121a33;
  --ink:#e9eefc;
  --muted:#aeb8da;
  --accent:#7aa7ff;
  --line:#263058;
  --radius:14px;
  --shadow:0 8px 20px rgba(0,0,0,.35);
}

body{
  margin:0;
  font:14px/1.4 system-ui,Segoe UI,Roboto,Arial;
  background:linear-gradient(180deg,#060912,#03040a);
  color:var(--ink);
}

.wrap{
  max-width:1200px;
  margin:auto;
  padding:14px;
}

h1{ margin:0 0 6px 0; font-size:18px; }
.sub{ color:var(--muted); font-size:12px; margin-bottom:10px; }

.card{
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:12px;
}

button{
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  color:var(--ink);
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
}

button:disabled{ opacity:.5; cursor:not-allowed; }

.controls{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }

/* ---------- Domino visuals ---------- */

.domino{
  width:46px;
  height:78px;
  border-radius:10px;
  border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
  display:flex;
  flex-direction:column;
  box-shadow:var(--shadow);
}

.domino.horizontal{
  width:78px;
  height:46px;
  flex-direction:row;
}

.domino.double{
  transform:rotate(90deg);
}

.half{
  flex:1;
  display:grid;
  place-items:center;
}

.pips{
  width:26px;
  height:26px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:3px;
}

.pips span{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff;
  opacity:0;
}

.domino::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:90%;
  height:1px;
  background:var(--line);
  transform:translate(-50%,-50%);
}

.domino.horizontal::after{
  width:1px;
  height:90%;
}

/* ---------- Snake layout ---------- */

.snake{
  display:flex;
  flex-direction:column;
  gap:10px;
  overflow-x:hidden;
}

.snakeRow{
  display:flex;
  gap:8px;
}

.snakeRow.reverse{
  flex-direction:row-reverse;
}

/* ---------- Hands ---------- */

.hand{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:8px;
}

.playable{
  outline:2px solid rgba(125,255,178,.6);
  cursor:pointer;
}

.back{
  width:46px;
  height:78px;
  border-radius:10px;
  border:1px solid var(--line);
  background:radial-gradient(circle at 30% 30%,rgba(122,167,255,.25),transparent 60%);
}

/* ---------- Layout ---------- */

.grid{
  display:grid;
  grid-template-columns:1.4fr .6fr;
  gap:12px;
}

@media(max-width:900px){
  .grid{ grid-template-columns:1fr; }
}
</style>
</head>

<body>
<div class="wrap">

<h1>Dominoes vs AI</h1>
<div class="sub">Standard draw game · doubles turn sideways · snake layout</div>

<div class="controls">
  <button id="newGame">New Game</button>
  <button id="drawBtn">Draw</button>
  <button id="passBtn">Pass</button>
</div>

<div class="grid">
  <div class="card">
    <strong>Table</strong>
    <div id="snake" class="snake"></div>
  </div>

  <div class="card">
    <strong>AI</strong>
    <div id="aiHand" class="hand"></div>

    <hr>

    <strong>You</strong>
    <div id="myHand" class="hand"></div>
  </div>
</div>

</div>

<script>
/* --------- Utilities ---------- */

function makePips(n){
  const map={
    0:[],
    1:[4],
    2:[0,8],
    3:[0,4,8],
    4:[0,2,6,8],
    5:[0,2,4,6,8],
    6:[0,2,3,5,6,8]
  }[n]||[];

  const el=document.createElement("div");
  el.className="pips";
  for(let i=0;i<9;i++){
    const s=document.createElement("span");
    if(map.includes(i)) s.style.opacity=1;
    el.appendChild(s);
  }
  return el;
}

function dominoEl(tile, opts={}){
  const d=document.createElement("div");
  d.className="domino";
  if(opts.horizontal) d.classList.add("horizontal");
  if(opts.double) d.classList.add("double");
  if(opts.playable) d.classList.add("playable");

  const h1=document.createElement("div");
  h1.className="half";
  h1.appendChild(makePips(tile.a));

  const h2=document.createElement("div");
  h2.className="half";
  h2.appendChild(makePips(tile.b));

  d.append(h1,h2);
  return d;
}

/* --------- Game State ---------- */

let deck=[], boneyard=[], me=[], ai=[], chain=[];
let turn="me";

function newGame(){
  deck=[];
  for(let a=0;a<=6;a++)for(let b=a;b<=6;b++)deck.push({a,b});
  deck.sort(()=>Math.random()-0.5);

  me=deck.splice(0,7);
  ai=deck.splice(0,7);
  boneyard=[...deck];
  chain=[];

  // opening move
  const all=[...me.map(t=>({...t,p:"me"})),...ai.map(t=>({...t,p:"ai"}))];
  all.sort((x,y)=>(y.a===y.b)-(x.a===x.b)||((y.a+y.b)-(x.a+x.b)));
  const o=all[0];
  chain.push({a:o.a,b:o.b});
  (o.p==="me"?me:ai).splice((o.p==="me"?me:ai).findIndex(t=>t.a===o.a&&t.b===o.b),1);
  turn=o.p==="me"?"ai":"me";

  render();
  if(turn==="ai") setTimeout(aiTurn,400);
}

/* --------- Rendering ---------- */

function render(){
  const snake=document.getElementById("snake");
  snake.innerHTML="";

  const maxPerRow=Math.max(4,Math.floor(snake.clientWidth/90));
  let row=[], rows=[row], dir=1;

  chain.forEach((t,i)=>{
    if(row.length>=maxPerRow){
      row=[];
      rows.push(row);
      dir*=-1;
    }
    row.push({t,dir});
  });

  rows.forEach((r,i)=>{
    const rowEl=document.createElement("div");
    rowEl.className="snakeRow"+(i%2?" reverse":"");
    r.forEach(o=>{
      rowEl.appendChild(
        dominoEl(o.t,{
          horizontal:true,
          double:o.t.a===o.t.b
        })
      );
    });
    snake.appendChild(rowEl);
  });

  const my=document.getElementById("myHand");
  my.innerHTML="";
  me.forEach((t,i)=>{
    const el=dominoEl(t,{playable:true});
    el.onclick=()=>playMe(i);
    my.appendChild(el);
  });

  const aiH=document.getElementById("aiHand");
  aiH.innerHTML="";
  ai.forEach(()=>aiH.appendChild(document.createElement("div")).className="back");
}

/* --------- Turns ---------- */

function playMe(i){
  if(turn!=="me") return;
  const t=me[i];
  const L=chain[0].a, R=chain.at(-1).b;

  if(t.a===L||t.b===L){
    chain.unshift({a:t.a===L?t.b:t.a,b:L});
  }else if(t.a===R||t.b===R){
    chain.push({a:R,b:t.a===R?t.b:t.a});
  }else return;

  me.splice(i,1);
  turn="ai";
  render();
  setTimeout(aiTurn,400);
}

function aiTurn(){
  for(let i=0;i<ai.length;i++){
    const t=ai[i],L=chain[0].a,R=chain.at(-1).b;
    if(t.a===L||t.b===L){
      chain.unshift({a:t.a===L?t.b:t.a,b:L});
      ai.splice(i,1); turn="me"; render(); return;
    }
    if(t.a===R||t.b===R){
      chain.push({a:R,b:t.a===R?t.b:t.a});
      ai.splice(i,1); turn="me"; render(); return;
    }
  }
  if(boneyard.length) ai.push(boneyard.pop());
  else turn="me";
  render();
}

/* --------- Controls ---------- */

document.getElementById("newGame").onclick=newGame;
document.getElementById("drawBtn").onclick=()=>{ if(turn==="me"&&boneyard.length){ me.push(boneyard.pop()); render(); }};
document.getElementById("passBtn").onclick=()=>{ if(turn==="me") turn="ai",setTimeout(aiTurn,400); };

newGame();
</script>
</body>
</html>
