<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Dominoes vs AI</title>

<style>
:root{
  --bg:#05060a;
  --panel:#0e1426;
  --ink:#e9eefc;
  --muted:#aeb8da;
  --line:#263058;
  --accent:#7aa7ff;
  --good:#7dffb2;
  --shadow:0 12px 30px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:linear-gradient(180deg,#070a12,#05060a);
  color:var(--ink);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:16px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}

button{
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 14px;
  cursor:pointer;
  box-shadow:var(--shadow);
}

button.primary{border-color:var(--accent)}
button.good{border-color:var(--good)}
button:disabled{opacity:.5;cursor:not-allowed}

.card{
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:14px;
  margin-bottom:12px;
}

/* ===== TABLE / SNAKE ===== */

#train{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.train-row{
  display:flex;
  gap:10px;
  align-items:center;
}

.train-row.reverse{
  flex-direction:row-reverse;
}

/* ===== DOMINO TILES ===== */

.tile{
  width:84px;
  height:48px;
  border-radius:12px;
  border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
  display:flex;
  position:relative;
}

.tile.vertical{
  width:48px;
  height:84px;
}

.half{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
}

.tile::after{
  content:"";
  position:absolute;
  background:var(--line);
}

.tile.horizontal::after{
  width:1px;
  height:90%;
  left:50%;
  top:5%;
}

.tile.vertical::after{
  height:1px;
  width:90%;
  top:50%;
  left:5%;
}

/* ===== PIPS ===== */

.pip{
  width:28px;
  height:28px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:3px;
}

.pip span{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff;
  opacity:0;
}

.hand{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.tile.playable{outline:2px solid var(--good)}
.tile.selected{outline:2px solid var(--accent)}

.back{
  width:48px;
  height:84px;
  border-radius:12px;
  border:1px solid var(--line);
  background:
    radial-gradient(circle at 30% 20%, rgba(122,167,255,.25), transparent 55%),
    linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
}
</style>
</head>

<body>
<div class="wrap">

<header>
  <strong>Dominoes vs AI</strong>
  <div>
    <button class="primary" id="newBtn">New game</button>
    <button id="drawBtn">Draw</button>
    <button id="passBtn">Pass</button>
  </div>
</header>

<div class="card">
  <div id="train"></div>
</div>

<div class="card">
  <strong>Your hand</strong>
  <div class="hand" id="myHand"></div>
</div>

<div class="card">
  <strong>AI hand</strong>
  <div class="hand" id="aiHand"></div>
</div>

</div>

<script>
/* ============================
   CORE GAME (logic unchanged)
   ============================ */

const trainEl = document.getElementById("train");
const myHandEl = document.getElementById("myHand");
const aiHandEl = document.getElementById("aiHand");
const drawBtn = document.getElementById("drawBtn");
const passBtn = document.getElementById("passBtn");
const newBtn = document.getElementById("newBtn");

let deck, boneyard, me, ai, chain, turn;

function makeDeck(){
  const d=[];
  for(let a=0;a<=6;a++)for(let b=a;b<=6;b++)d.push({a,b});
  return d;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()* (i+1)|0;[a[i],a[j]]=[a[j],a[i]]}}
function pips(n){
  const map={
    0:[],
    1:[4],
    2:[0,8],
    3:[0,4,8],
    4:[0,2,6,8],
    5:[0,2,4,6,8],
    6:[0,2,3,5,6,8]
  };
  const d=document.createElement("div");
  d.className="pip";
  for(let i=0;i<9;i++){
    const s=document.createElement("span");
    if(map[n].includes(i))s.style.opacity=1;
    d.appendChild(s);
  }
  return d;
}

/* ============================
   SNAKE RENDERER
   ============================ */

function renderTrain(){
  trainEl.innerHTML="";
  if(chain.length===0)return;

  const maxPerRow = Math.floor(trainEl.clientWidth / 100) || 6;
  let row, reverse=false;

  chain.forEach((t,i)=>{
    if(i%maxPerRow===0){
      row=document.createElement("div");
      row.className="train-row"+(reverse?" reverse":"");
      trainEl.appendChild(row);
      reverse=!reverse;
    }

    const isDouble = t.a===t.b;
    const tile=document.createElement("div");
    tile.className="tile "+(isDouble?"vertical":"horizontal");

    const h1=document.createElement("div");
    const h2=document.createElement("div");
    h1.className=h2.className="half";
    h1.appendChild(pips(t.a));
    h2.appendChild(pips(t.b));

    tile.appendChild(h1);
    tile.appendChild(h2);
    row.appendChild(tile);
  });
}

/* ============================
   HAND RENDER
   ============================ */

function renderHands(){
  myHandEl.innerHTML="";
  me.forEach((t,i)=>{
    const tile=document.createElement("div");
    tile.className="tile "+(t.a===t.b?"vertical":"horizontal")+" playable";
    tile.onclick=()=>playTile(i);

    const h1=document.createElement("div");
    const h2=document.createElement("div");
    h1.className=h2.className="half";
    h1.appendChild(pips(t.a));
    h2.appendChild(pips(t.b));
    tile.appendChild(h1);tile.appendChild(h2);
    myHandEl.appendChild(tile);
  });

  aiHandEl.innerHTML="";
  ai.forEach(()=>aiHandEl.appendChild(Object.assign(document.createElement("div"),{className:"back"})));
}

/* ============================
   GAME FLOW
   ============================ */

function playTile(i){
  const t=me[i];
  if(chain.length===0){
    chain.push(t);me.splice(i,1);turn="ai";
  }else{
    const left=chain[0].a,right=chain[chain.length-1].b;
    if(t.a===right||t.b===right){
      chain.push(t.a===right?t:{a:t.b,b:t.a});
      me.splice(i,1);turn="ai";
    }
  }
  update();
}

function aiTurn(){
  for(let i=0;i<ai.length;i++){
    const t=ai[i];
    const right=chain[chain.length-1].b;
    if(t.a===right||t.b===right){
      chain.push(t.a===right?t:{a:t.b,b:t.a});
      ai.splice(i,1);
      turn="me";
      update();
      return;
    }
  }
  if(boneyard.length)ai.push(boneyard.pop());
  turn="me";
  update();
}

function update(){
  renderTrain();
  renderHands();
  if(turn==="ai")setTimeout(aiTurn,400);
}

newBtn.onclick=()=>{
  deck=makeDeck();shuffle(deck);
  boneyard=[...deck];
  me=[];ai=[];chain=[];
  for(let i=0;i<7;i++){me.push(boneyard.pop());ai.push(boneyard.pop())}
  turn="me";
  update();
};

newBtn.click();
</script>
</body>
</html>
