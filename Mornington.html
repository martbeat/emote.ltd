<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mornington Crescent — Pass & Play Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#070a12;
  --panel:#0e1426;
  --ink:#e9eefc;
  --muted:#aeb8da;
  --accent:#7aa7ff;
  --good:#7dffb2;
  --bad:#ff6b88;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: radial-gradient(1200px 800px at 20% 10%, rgba(122,167,255,.15), transparent 60%),
              linear-gradient(180deg,#05060a,var(--bg));
  color:var(--ink);
}

header{
  max-width:1200px;
  margin:auto;
  padding:18px 16px 10px;
}

h1{
  margin:0;
  font-size:20px;
}

.sub{
  margin-top:6px;
  color:var(--muted);
  font-size:13px;
}

main{
  max-width:1200px;
  margin:auto;
  padding:0 16px 20px;
  display:grid;
  grid-template-columns: 1.4fr .6fr;
  gap:14px;
}

@media(max-width:900px){
  main{grid-template-columns:1fr}
}

.panel{
  background:linear-gradient(180deg,rgba(14,20,38,.95),rgba(10,14,28,.95));
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  box-shadow:0 14px 40px rgba(0,0,0,.45);
  overflow:hidden;
}

.panel h2{
  margin:0;
  padding:12px 14px;
  font-size:14px;
  border-bottom:1px solid rgba(255,255,255,.1);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.controls{
  padding:12px 14px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

label{
  font-size:12px;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  gap:6px;
  min-width:160px;
}

select,button{
  border-radius:12px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(4,7,14,.7);
  color:var(--ink);
  padding:10px;
}

button{
  cursor:pointer;
  font-weight:700;
}

button.primary{
  background:linear-gradient(135deg,var(--accent),#5c7dff);
  color:#061026;
}

button.good{
  background:linear-gradient(135deg,var(--good),#4ddfa0);
  color:#042018;
}

button.bad{
  background:linear-gradient(135deg,var(--bad),#ff4f6f);
  color:#2a050b;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.status{
  padding:12px 14px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  border-top:1px solid rgba(255,255,255,.08);
}

.pill{
  padding:8px 10px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.14);
  font-size:12px;
  color:var(--muted);
}

.board{
  padding:12px 14px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.tag{
  padding:8px 10px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.14);
  font-size:12px;
  display:inline-flex;
  gap:6px;
  align-items:center;
}

.log{
  padding:12px 14px;
  max-height:520px;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.entry{
  padding:10px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(2,4,10,.35);
  font-size:12px;
  color:var(--muted);
}

.entry b{color:var(--ink)}

.entry.good{border-color:rgba(125,255,178,.45)}
.entry.bad{border-color:rgba(255,107,136,.45)}
.entry.info{border-color:rgba(122,167,255,.45)}

.footer{
  padding:10px 14px;
  border-top:1px solid rgba(255,255,255,.08);
  font-size:11px;
  color:var(--muted);
}
</style>
</head>

<body>

<header>
  <h1>Mornington Crescent</h1>
  <div class="sub">
    Pass-and-play for humans and AIs.  
    The rules are ancient, binding, frequently revised, and mostly invented.
  </div>
</header>

<main>

<section class="panel">
<h2>Game</h2>

<div class="controls">
  <label>
    Players
    <select id="players">
      <option value="2">2 players</option>
      <option value="3">3 players</option>
      <option value="4">4 players</option>
    </select>
  </label>

  <label>
    AI seats
    <select id="aiCount">
      <option value="0">All human</option>
      <option value="1">1 AI</option>
      <option value="2">2 AI</option>
    </select>
  </label>

  <div style="align-self:flex-end;display:flex;gap:8px">
    <button id="play" class="primary">Play move</button>
    <button id="pass">Pass</button>
    <button id="new" class="good">New game</button>
  </div>
</div>

<div class="board" id="board"></div>

<div class="status">
  <div class="pill">Turn: <b id="turn"></b></div>
  <div class="pill">Round <b id="round"></b></div>
</div>
</section>

<section class="panel">
<h2>Commentary</h2>
<div class="log" id="log"></div>
<div class="footer">
  Win only by landing exactly on <b>Mornington Crescent</b>.  
  Saying it loudly does not help. It never has.
</div>
</section>

</main>

<script>
/* ------------------------------
   Network (expanded but curated)
--------------------------------*/

const MC = "Mornington Crescent";

const EDGES = {
  "Paddington":["Baker Street","Edgware Road"],
  "Edgware Road":["Paddington","Baker Street"],
  "Baker Street":["Edgware Road","Paddington","Bond Street","Euston"],
  "Bond Street":["Baker Street","Oxford Circus","Green Park"],
  "Oxford Circus":["Bond Street","Tottenham Court Road","Green Park"],
  "Tottenham Court Road":["Oxford Circus","Leicester Square","Goodge Street"],
  "Goodge Street":["Tottenham Court Road","Warren Street"],
  "Warren Street":["Goodge Street","Euston"],
  "Euston":["Warren Street","King's Cross","Camden Town","Baker Street"],
  "King's Cross":["Euston","Angel","Russell Square"],
  "Russell Square":["King's Cross","Holborn"],
  "Holborn":["Russell Square","Leicester Square"],
  "Leicester Square":["Holborn","Tottenham Court Road","Charing Cross"],
  "Charing Cross":["Leicester Square","Embankment"],
  "Embankment":["Charing Cross","Westminster"],
  "Westminster":["Embankment","Green Park"],
  "Green Park":["Westminster","Bond Street","Oxford Circus","Piccadilly Circus"],
  "Piccadilly Circus":["Green Park","Leicester Square"],
  "Angel":["King's Cross","Highbury & Islington"],
  "Highbury & Islington":["Angel","Finsbury Park"],
  "Finsbury Park":["Highbury & Islington"],
  "Camden Town":["Euston",MC],
  "Mornington Crescent":["Camden Town"]
};

const STATIONS = Object.keys(EDGES);

/* ------------------------------
   Commentary engine
--------------------------------*/

const COMMENTARY = {
  start:[
    "The board is laid out. No one agrees who laid it out.",
    "Officials shuffle papers they definitely wrote themselves.",
    "The signal lamp flickers. This is taken as consent."
  ],
  move:[
    "A confident choice, immediately questioned.",
    "A move is made. Somewhere, a precedent is misquoted.",
    "Textbook play, from a textbook no one can locate.",
    "An inspired decision, according to the wrong handbook."
  ],
  reject:[
    "Rejected. The reason is waved vaguely at the ceiling.",
    "Illegal. Someone coughs 'sub-clause'.",
    "Denied on grounds that will be clear later."
  ],
  pass:[
    "A pass. The room murmurs.",
    "Passing is permitted, but frowned upon by history.",
    "A tactical pause, or a cry for help."
  ],
  approach:[
    "This is beginning to look deliberate.",
    "The Crescent grows nearer. No one says how near.",
    "There is a sense of gathering inevitability."
  ],
  win:[
    "Mornington Crescent. The ruling stands.",
    "There it is. No appeal will be heard.",
    "Victory is declared. The rulebook snaps shut."
  ],
  ai:[
    "The AI nods, having simulated regret.",
    "The AI claims this was always the plan.",
    "The AI moves with unsettling confidence."
  ]
};

function say(type,text,className="info"){
  const e=document.createElement("div");
  e.className="entry "+className;
  e.innerHTML="<b>"+type+":</b> "+text;
  log.prepend(e);
}

/* ------------------------------
   Game state
--------------------------------*/

let players=[], current=0, round=1;

const board=document.getElementById("board");
const log=document.getElementById("log");

function distance(a){
  const q=[a], d={[a]:0};
  while(q.length){
    const u=q.shift();
    if(u===MC) return d[u];
    for(const v of EDGES[u]){
      if(d[v]==null){d[v]=d[u]+1;q.push(v);}
    }
  }
  return Infinity;
}

function newGame(){
  players=[];
  log.innerHTML="";
  round=1;
  current=0;

  const pCount=+playersSel.value;
  const aiCount=+aiSel.value;

  const starts=STATIONS.filter(s=>s!==MC && distance(s)>2);

  for(let i=0;i<pCount;i++){
    players.push({
      name: i<aiCount ? "AI "+(i+1) : "Player "+(i+1-aiCount),
      ai: i<aiCount,
      pos: starts.splice(Math.floor(Math.random()*starts.length),1)[0]
    });
  }

  say("Announcer",COMMENTARY.start[Math.floor(Math.random()*COMMENTARY.start.length)]);
  render();
}

function render(){
  board.innerHTML="";
  players.forEach((p,i)=>{
    const d=document.createElement("div");
    d.className="tag";
    d.style.borderColor=i===current?"var(--accent)":"rgba(255,255,255,.2)";
    d.innerHTML="<b>"+p.name+"</b> at "+p.pos+" (MC "+distance(p.pos)+")";
    board.appendChild(d);
  });

  turnEl.textContent=players[current].name;
  roundEl.textContent=round;
}

function playMove(){
  const p=players[current];
  const opts=EDGES[p.pos];
  let choice;

  if(p.ai){
    opts.sort((a,b)=>distance(a)-distance(b));
    choice=opts[0];
    say("AI",COMMENTARY.ai[Math.floor(Math.random()*COMMENTARY.ai.length)]);
  }else{
    choice=prompt("Choose next station:\n"+opts.join(", "));
    if(!opts.includes(choice)){
      say("Announcer",COMMENTARY.reject[Math.floor(Math.random()*COMMENTARY.reject.length)],"bad");
      return;
    }
  }

  p.pos=choice;
  say(p.name,COMMENTARY.move[Math.floor(Math.random()*COMMENTARY.move.length)]+" ("+choice+")");

  if(distance(choice)<=2){
    say("Announcer",COMMENTARY.approach[Math.floor(Math.random()*COMMENTARY.approach.length)]);
  }

  if(choice===MC){
    say("Announcer",COMMENTARY.win[Math.floor(Math.random()*COMMENTARY.win.length)],"good");
    playBtn.disabled=passBtn.disabled=true;
    return;
  }

  nextTurn();
}

function passTurn(){
  say(players[current].name,COMMENTARY.pass[Math.floor(Math.random()*COMMENTARY.pass.length)]);
  nextTurn();
}

function nextTurn(){
  current=(current+1)%players.length;
  if(current===0) round++;
  render();
  if(players[current].ai) setTimeout(playMove,600);
}

/* ------------------------------
   Wire up
--------------------------------*/

const playersSel=document.getElementById("players");
const aiSel=document.getElementById("aiCount");
const playBtn=document.getElementById("play");
const passBtn=document.getElementById("pass");
const newBtn=document.getElementById("new");
const turnEl=document.getElementById("turn");
const roundEl=document.getElementById("round");

playBtn.onclick=playMove;
passBtn.onclick=passTurn;
newBtn.onclick=()=>{playBtn.disabled=passBtn.disabled=false;newGame();};

newGame();
</script>
</body>
</html>
