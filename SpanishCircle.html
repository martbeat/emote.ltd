<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spanish Circle: Voces del Mundo</title>
  <meta name="description" content="A friendly Spanish-circle game with vocabulary, useful phrases, and regional and street slang from Bolivia, Mexico, Spain, and beyond." />
  <style>
    :root{
      --bg:#0f1329;
      --panel:#181f43;
      --ink:#f6f7ff;
      --muted:#c0c8ef;
      --accent:#77e2b1;
      --accent2:#84a8ff;
      --good:#6ff0be;
      --bad:#ff8fa4;
      --card:#ffffff12;
      --border:#ffffff28;
      --shadow:0 14px 32px rgba(0,0,0,.35);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100svh;
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      color:var(--ink);
      background:
        radial-gradient(1000px 600px at 0 -20%, #364ab066, transparent),
        radial-gradient(900px 560px at 100% 0, #189f7866, transparent),
        linear-gradient(180deg, #0a0d1d, var(--bg));
      display:grid;
      place-items:center;
      padding:16px;
      line-height:1.45;
    }
    .game{
      width:min(860px, 100%);
      background:linear-gradient(180deg, #1b2250, var(--panel));
      border:1px solid #ffffff24;
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:20px;
    }
    h1{margin:0 0 8px;font-size:clamp(1.6rem,3.4vw,2.3rem)}
    .sub{margin:0 0 14px;color:var(--muted);font-size:1.03rem}

    .toolbar,.stats,.footer{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .toolbar{margin-bottom:14px}
    .stats{justify-content:space-between;margin-bottom:14px}

    .pill{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:999px;
      padding:8px 14px;
      font-size:1.02rem;
      font-weight:700;
    }

    .panel{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:16px;
    }

    .prompt{font-size:1.35rem;font-weight:800;margin:0 0 6px}
    .hint,.region{margin:0;color:var(--muted);font-size:1.02rem}
    .region{margin-top:5px}

    .options{
      margin-top:12px;
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }

    button,select{
      font:inherit;
      border-radius:12px;
      border:1px solid #ffffff33;
      color:var(--ink);
      background:#0c1130;
      padding:10px 12px;
    }

    button{cursor:pointer;font-weight:700}
    button:hover{border-color:#ffffff66;transform:translateY(-1px)}
    button:disabled{opacity:.67;cursor:not-allowed;transform:none}

    .opt{min-height:62px;text-align:left;background:#ffffff12}
    .opt.good{background:color-mix(in srgb,var(--good) 35%, transparent);border-color:var(--good)}
    .opt.bad{background:color-mix(in srgb,var(--bad) 35%, transparent);border-color:var(--bad)}

    .primary{background:linear-gradient(180deg,var(--accent2),#607ed8);border:none}
    .secondary{background:linear-gradient(180deg,var(--accent),#56bb8f);border:none;color:#0f1a1e}

    .footer{justify-content:space-between;margin-top:14px}
    .msg{font-size:1.05rem;font-weight:700;min-height:1.3em;margin:0}

    .note,.summary{margin-top:14px}
    .note{font-size:.97rem;color:var(--muted)}
    .summary{display:none}

    @media (max-width:700px){
      .options{grid-template-columns:1fr}
      .prompt{font-size:1.25rem}
    }
  </style>
  <link rel="stylesheet" href="assets/css/sky-theme.css" />
</head>
<body>
  <main class="game">
    <h1>Spanish Circle: Voces del Mundo 🌎</h1>
    <p class="sub" id="sub"></p>

    <div class="toolbar">
      <label for="mode" id="modeLabel"></label>
      <select id="mode">
        <option value="core" id="deckCore"></option>
        <option value="phrases" id="deckPhrases"></option>
        <option value="idioms" id="deckIdioms"></option>
        <option value="regional" id="deckRegional"></option>
        <option value="mixed" id="deckMixed"></option>
      </select>
      <label for="rounds" id="roundsLabel"></label>
      <select id="rounds">
        <option value="8">8</option>
        <option value="10" selected>10</option>
        <option value="12">12</option>
      </select>
      <label for="uiLang" id="langLabel"></label>
      <select id="uiLang">
        <option value="en">English UI</option>
        <option value="es">Interfaz en español</option>
      </select>
      <button id="newGame" class="secondary"></button>
    </div>

    <div class="stats">
      <span class="pill" id="score"></span>
      <span class="pill" id="streak"></span>
      <span class="pill" id="progress"></span>
    </div>

    <section class="panel">
      <p class="prompt" id="prompt"></p>
      <p class="hint" id="hint"></p>
      <p class="region" id="region"></p>
      <div class="options" id="options"></div>
    </section>

    <div class="footer">
      <p class="msg" id="msg"></p>
      <div>
        <button id="speakPrompt" class="primary"></button>
        <button id="speakOptions" class="primary"></button>
        <button id="reveal" class="primary" disabled></button>
        <button id="next" class="primary" disabled></button>
      </div>
    </div>

    <section class="panel summary" id="summary"></section>

    <p class="note" id="hostNote"></p>
  </main>

al tiro|immediately|tomorrow|slowly|with effort|Means right away in Chile and parts of Mexico contexts.|Chile/Mexico 🇨🇱🇲🇽
chequear|to check|to cook|to dance|to wait|Common Spanglish borrowing in US Latino communities.|US Latino / LatAm 🌎
textear|to send a text|to call back|to park|to apply|Frequent digital-age Spanglish verb.|US Latino / LatAm 🌎

¿me das un ride?|can you give me a lift?|can you sell me a car?|can you call a taxi?|can you wait here?|Socially common Spanglish request in bilingual settings.|US Latino 🌎
guagua (Caribe)|bus|baby|cake|job|In Caribbean Spanish, guagua usually means bus.|Caribe 🌴
guagua (Andes)|baby / small child|bus|wallet|teacher|In Andean Spanish, guagua commonly means baby.|Andes 🇧🇴🇪🇨🇵🇪
torta (México)|sandwich|birthday cake|bus ticket|work shift|In Mexico, torta is typically a sandwich.|Mexico 🇲🇽
torta (Argentina)|cake|sandwich|bus|wallet|In Argentina/Uruguay, torta usually means cake.|Argentina/Uruguay 🇦🇷🇺🇾
chamba (uso general)|work / job (informal)|party|dessert|street|In many countries, chamba is informal but neutral for work.|LatAm 🌎
insulto suave: menso/mensa|dummy / silly person|best friend|teacher|artist|Mild insult in Mexico; less harsh than stronger profanity.|Mexico 🇲🇽`;

    const decks = {
      core: parseDeck(coreRaw),
      phrases: parseDeck(phrasesRaw),
      idioms: parseDeck(idiomsRaw),
      regional: parseDeck(regionalRaw)
    };
    const state = { score: 0, streak: 0, index: 0, total: 10, asked: [], current: null, answered: false };

    const I18N = {
      en: {
        sub: "Friendly turn-based play for your circle (especially great for 60+ learners): no timer, clear text, and culture-rich language, idioms, and street slang from Bolivia, Mexico, Spain, and more.",
        modeLabel: "Deck:",
        deckCore: "Core Vocabulary",
        deckPhrases: "Useful Phrases",
        deckIdioms: "Idioms & Sayings",
        deckRegional: "Regional + Street Slang",
        deckMixed: "Mixed Circle Mode",
        roundsLabel: "Questions:",
        langLabel: "UI language:",
        newGame: "Start fresh round",
        reveal: "Reveal context",
        next: "Next",
        speakPrompt: "Say word/phrase",
        speakOptions: "Say English options",
        speechNotSupported: "Speech is not supported in this browser.",
        hostNote: "Tip for hosts: after each answer, ask someone to make a short sentence using that word or expression. Some cards include profanity, insults, and country-specific slang; discuss tone, audience, and when NOT to use them.",

        question: "Question",
        hintQuestion: "Choose the best meaning, then discuss a sentence together.",

        bestStreak: "Best streak:",

      },
      es: {
        sub: "Juego amistoso por turnos para tu círculo (ideal para personas de 60+): sin cronómetro, texto claro y lenguaje con cultura, modismos y jerga callejera de Bolivia, México, España y más.",
        modeLabel: "Mazo:",
        deckCore: "Vocabulario básico",
        deckPhrases: "Frases útiles",
        deckIdioms: "Modismos y refranes",
        deckRegional: "Regional + Jerga callejera",
        deckMixed: "Modo mixto del círculo",
        roundsLabel: "Preguntas:",
        langLabel: "Idioma de la interfaz:",
        newGame: "Empezar ronda nueva",
        reveal: "Mostrar contexto",
        next: "Siguiente",
        speakPrompt: "Decir palabra/frase",
        speakOptions: "Decir opciones en inglés",
        speechNotSupported: "La síntesis de voz no está disponible en este navegador.",
        hostNote: "Consejo para anfitriones: tras cada respuesta, pide a alguien que haga una frase corta con esa palabra o expresión. Algunas tarjetas incluyen palabrotas, insultos y jerga específica por país; comenten el tono, el público y cuándo NO usarlos.",
        score: "Puntuación del equipo",
        streak: "Racha",
        question: "Pregunta",
        hintQuestion: "Elige el mejor significado y luego comenten una frase juntos.",
        regionNote: "Nota regional",
        okMsg: "¡Muy bien! +{points} puntos. Invita a otra persona a usarlo en una frase.",
        badMsg: "Buen intento. Respuesta correcta: {answer}",
        contextLabel: "Contexto:",
        reminderLabel: "Recordatorio:",
        reminderText: "La jerga varía por país, edad y situación. Pregunten a hablantes nativos qué suena más natural en su región.",
        roundComplete: "Ronda terminada 🎉",
        switchDeck: "Cambia el mazo o el número de preguntas y vuelve a empezar.",
        finalScore: "Puntuación final del equipo:",
        bestStreak: "Mejor racha:",
        suggested: "Actividad sugerida: cada persona elige una palabra nueva de la ronda y dice una frase sobre familia, comida, viajes o recuerdos."
      }
    };
    let uiLang = 'en';
    const t = k => I18N[uiLang][k];

    const scoreEl = document.getElementById('score');
    const streakEl = document.getElementById('streak');
    const progressEl = document.getElementById('progress');
    const promptEl = document.getElementById('prompt');
    const hintEl = document.getElementById('hint');
    const regionEl = document.getElementById('region');
    const optionsEl = document.getElementById('options');
    const msgEl = document.getElementById('msg');
    const summaryEl = document.getElementById('summary');
    const modeEl = document.getElementById('mode');
    const roundsEl = document.getElementById('rounds');
    const uiLangEl = document.getElementById('uiLang');
    const nextBtn = document.getElementById('next');
    const revealBtn = document.getElementById('reveal');
    const speakPromptBtn = document.getElementById('speakPrompt');
    const speakOptionsBtn = document.getElementById('speakOptions');

    const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);

    function mixedDeck(){
      return [...decks.core, ...decks.phrases, ...decks.idioms, ...decks.regional];
    }

    function activeDeck(){
      if(modeEl.value === 'mixed') return mixedDeck();
      return decks[modeEl.value];
    }

    function applyUIText(){
      document.getElementById('sub').textContent = t('sub');
      document.getElementById('modeLabel').textContent = t('modeLabel');
      document.getElementById('deckCore').textContent = t('deckCore');
      document.getElementById('deckPhrases').textContent = t('deckPhrases');
      document.getElementById('deckIdioms').textContent = t('deckIdioms');
      document.getElementById('deckRegional').textContent = t('deckRegional');
      document.getElementById('deckMixed').textContent = t('deckMixed');
      document.getElementById('roundsLabel').textContent = t('roundsLabel');
      document.getElementById('langLabel').textContent = t('langLabel');
      document.getElementById('newGame').textContent = t('newGame');
      revealBtn.textContent = t('reveal');
      nextBtn.textContent = t('next');
      speakPromptBtn.textContent = t('speakPrompt');
      speakOptionsBtn.textContent = t('speakOptions');
      document.getElementById('hostNote').textContent = t('hostNote');
    }

    function updateStats(){
      scoreEl.textContent = `${t('score')}: ${state.score}`;
      streakEl.textContent = `${t('streak')}: ${state.streak} 🔥`;
      progressEl.textContent = `${t('question')} ${Math.min(state.index + 1, state.total)}/${state.total}`;
    }

    function speakText(text, lang){
      if (!('speechSynthesis' in window)) {
        msgEl.textContent = t('speechNotSupported');
        return;
      }
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      utter.rate = 0.95;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utter);
    }

    function speakPrompt(){
      if (!state.current) return;
      speakText(state.current.prompt, 'es-ES');
    }

    function speakEnglishOptions(){
      if (!state.current) return;
      const text = state.current.options.join('. ');
      speakText(text, 'en-US');
    }

    function pickQuestion(){
      const deck = activeDeck();
      const available = deck.filter(item => !state.asked.includes(item.prompt));
      const source = available.length ? available : deck;
      const item = source[Math.floor(Math.random() * source.length)];
      state.asked.push(item.prompt);
      return item;
    }

    function renderQuestion(){
      state.current = pickQuestion();
      state.answered = false;
      promptEl.textContent = state.current.prompt;
      hintEl.textContent = t('hintQuestion');
      regionEl.textContent = `${t('regionNote')}: ${state.current.region}`;
      msgEl.textContent = '';
      summaryEl.style.display = 'none';
      nextBtn.disabled = true;
      revealBtn.disabled = true;

      optionsEl.innerHTML = '';
      shuffle(state.current.options).forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'opt';
        btn.textContent = choice;
        btn.onclick = () => answer(btn, choice);
        optionsEl.appendChild(btn);
      });
    }

    function answer(button, choice){
      if(state.answered) return;
      state.answered = true;

      const isCorrect = choice === state.current.answer;
      [...optionsEl.children].forEach(opt => {
        opt.disabled = true;
        if(opt.textContent === state.current.answer) opt.classList.add('good');
      });

      if(isCorrect){
        state.streak += 1;
        const bonus = Math.min(8, state.streak);
        state.score += 10 + bonus;
        msgEl.textContent = t('okMsg').replace('{points}', 10 + bonus);
      } else {
        state.streak = 0;
        button.classList.add('bad');
        msgEl.textContent = t('badMsg').replace('{answer}', state.current.answer);
      }

      updateStats();
      nextBtn.disabled = false;
      revealBtn.disabled = false;
    }

    function reveal(){
      if(!state.current) return;
      summaryEl.style.display = 'block';
      summaryEl.innerHTML = `<strong>${t('contextLabel')}</strong> ${state.current.context}<br><strong>${t('reminderLabel')}</strong> ${t('reminderText')}`;
    }

    function finishGame(){
      optionsEl.innerHTML = '';
      promptEl.textContent = t('roundComplete');
      hintEl.textContent = t('switchDeck');
      regionEl.textContent = '';
      nextBtn.disabled = true;
      revealBtn.disabled = true;
      summaryEl.style.display = 'block';
      summaryEl.innerHTML = `<strong>${t('finalScore')}</strong> ${state.score}<br><strong>${t('bestStreak')}</strong> ${state.streak}<br><br>${t('suggested')}`;
    }

    function next(){
      state.index += 1;
      if(state.index >= state.total){
        finishGame();
        return;
      }
      updateStats();
      renderQuestion();
    }

    function newGame(){
      state.score = 0;
      state.streak = 0;
      state.index = 0;
      state.asked = [];
      state.total = Number(roundsEl.value);
      applyUIText();
      updateStats();
      renderQuestion();
    }

    nextBtn.addEventListener('click', next);
    revealBtn.addEventListener('click', reveal);
    document.getElementById('newGame').addEventListener('click', newGame);
    speakPromptBtn.addEventListener('click', speakPrompt);
    speakOptionsBtn.addEventListener('click', speakEnglishOptions);
    uiLangEl.addEventListener('change', () => { uiLang = uiLangEl.value; applyUIText(); updateStats(); renderQuestion(); });

    applyUIText();
    newGame();
  </script>
  <script defer src="assets/js/sky-theme.js"></script>
