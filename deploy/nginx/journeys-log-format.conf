# Load in nginx's http context, for example /etc/nginx/conf.d/emote-journeys-log.conf.
# It only defines a format; it does not enable a new log by itself.
log_format emote_journey_json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"user_agent":"$http_user_agent","referrer":"$http_referer",'
    '"sec_purpose":"$http_sec_purpose","purpose":"$http_purpose",'
    '"fetch_dest":"$http_sec_fetch_dest","fetch_mode":"$http_sec_fetch_mode",'
    '"fetch_user":"$http_sec_fetch_user","cf_connecting_ip":"$http_cf_connecting_ip"}';

# After loading this format, add the following alongside the existing access_log
# in the emote.ltd server block. Keep the existing main log for other analytics:
# access_log /var/log/nginx/emote.journeys.log emote_journey_json;
