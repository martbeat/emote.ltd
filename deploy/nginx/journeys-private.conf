# Include INSIDE the emote.ltd HTTPS server block after creating the password file.
# The report remains outside the public web root.
location = /stats/private/journeys.json {
    auth_basic "eMote private analytics";
    auth_basic_user_file /etc/nginx/emote-analytics.htpasswd;
    alias /var/lib/emote-analytics/journeys.json;
    default_type application/json;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "private, no-store" always;
}
