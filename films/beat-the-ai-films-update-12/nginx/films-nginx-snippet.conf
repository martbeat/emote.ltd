# Beat the AI film prototype
# Add this inside the emote.ltd server block, adjusting fastcgi_pass if your fcgiwrap socket differs.

location = /films/admin.html {
    auth_basic "Film admin";
    auth_basic_user_file /etc/nginx/.htpasswd-films;
}

location ^~ /films/api/ {
    # Optional: restrict methods
    limit_except POST { deny all; }

    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/emote.ltd/html$fastcgi_script_name;
    fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    fastcgi_pass unix:/run/fcgiwrap.socket;
}