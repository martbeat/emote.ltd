  <meta property="og:title" content="Games Hub | eMote" />
  <meta property="og:description" content="A directory of browser-based experiments and games from eMote." />
  <meta property="og:image" content="https://emote.ltd/assets/images/card-kite-freedom.png" />
  <meta property="og:url" content="https://emote.ltd/games.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="eMote" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Games Hub | eMote" />
  <meta name="twitter:description" content="A directory of browser-based experiments and games from eMote." />
  <meta name="twitter:image" content="https://emote.ltd/assets/images/card-kite-freedom.png" />

  <style>
    :root{
      --bg0:#05060a;
      --bg1:#070a12;
      --card:#0e1426cc;
      --card2:#0b1020cc;
      --ink:#e9eefc;
      --muted:#aeb8da;
      --accent:#7aa7ff;
      --accent2:#7dffb2;
      --danger:#ff6b88;
      --shadow: 0 12px 30px rgba(0,0,0,.35);
      --radius: 18px;
      --ring: 0 0 0 2px rgba(122,167,255,.20), 0 0 0 6px rgba(122,167,255,.10);
      --grid: rgba(255,255,255,.06);
      --ambient-a:#15214a;
      --ambient-b:#123a2d;
      --ambient-c:#3a1730;
      --surface: rgba(10,14,28,.55);
    }
:root{
  --safeB: env(safe-area-inset-bottom, 0px);
  --footerPad: 86px;  /* JS will override with actual footer height */
  --headerH: 94px;    /* JS can override too */
}

    *{ box-sizing:border-box; }
    html, body { height:100%; }
    body{
      margin:0;
      color:var(--ink);
      font: 15px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial;
      background: radial-gradient(1200px 900px at 20% 10%, var(--ambient-a) 0%, transparent 60%),
                  radial-gradient(900px 700px at 80% 30%, var(--ambient-b) 0%, transparent 62%),
                  radial-gradient(900px 900px at 50% 95%, var(--ambient-c) 0%, transparent 60%),
                  linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow:hidden;
      transition: background .5s ease, color .35s ease;
    }

    body[data-theme="day"]{
      --bg0:#e7f2ff;
      --bg1:#fff6db;
      --card:#ffffffcf;
      --card2:#eef4ffd9;
      --ink:#19213b;
      --muted:#516286;
      --accent:#2f69ff;
      --accent2:#16b37b;
      --danger:#b84265;
      --grid: rgba(13,29,73,.10);
      --ambient-a:#a7d7ff;
      --ambient-b:#fff1ac;
      --ambient-c:#ffd9d9;
      --surface: rgba(255,255,255,.72);
      --shadow: 0 12px 30px rgba(41,78,155,.18);
      --ring: 0 0 0 2px rgba(47,105,255,.20), 0 0 0 6px rgba(47,105,255,.10);
    }

    body[data-weather="rain"]{
      --ambient-b:#8cb4c9;
      --ambient-c:#95a2cf;
    }
    body[data-weather="storm"]{
      --ambient-a:#2f3766;
      --ambient-b:#34456f;
      --ambient-c:#35284e;
    }
    body[data-weather="snow"]{
      --ambient-a:#d9ebff;
      --ambient-b:#dce3fb;
    }

    /* subtle animated grid */
    .grid{
      position:fixed; inset:0;
      background:
        linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 46px 46px,
        linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 46px 46px;
      opacity:.25;
      filter: blur(.1px);
      transform: translateZ(0);
      animation: gridDrift 18s linear infinite;
      pointer-events:none;
    }
    @keyframes gridDrift{
      0%{ background-position: 0 0, 0 0; }
      100%{ background-position: 300px 220px, 300px 220px; }
    }

    /* animated background "orbs" */
    .orb{
      position:fixed;
      width: 44vmax; height: 44vmax;
      border-radius: 50%;
      filter: blur(50px);
      opacity:.16;
      mix-blend-mode: screen;
      pointer-events:none;
      transform: translateZ(0);
    }
    .orb.a{ left:-12vmax; top:-16vmax; background: radial-gradient(circle at 30% 30%, #7aa7ff, transparent 60%); animation: floatA 13s ease-in-out infinite; }
    .orb.b{ right:-18vmax; top: 8vmax; background: radial-gradient(circle at 30% 30%, #7dffb2, transparent 60%); animation: floatB 16s ease-in-out infinite; }
    .orb.c{ left: 10vmax; bottom:-20vmax; background: radial-gradient(circle at 30% 30%, #ff6b88, transparent 60%); animation: floatC 19s ease-in-out infinite; }
    @keyframes floatA{ 0%,100%{ transform: translate(0,0) scale(1);} 50%{ transform: translate(6vmax, 5vmax) scale(1.05);} }
    @keyframes floatB{ 0%,100%{ transform: translate(0,0) scale(1);} 50%{ transform: translate(-7vmax, 4vmax) scale(1.08);} }
    @keyframes floatC{ 0%,100%{ transform: translate(0,0) scale(1);} 50%{ transform: translate(5vmax, -6vmax) scale(1.07);} }

    /* top UI */
    header{
      position:relative;
      z-index:3;
      padding: 22px 18px 10px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 14px;
      max-width: 1100px;
      margin: 0 auto;
      transition: padding .25s ease, opacity .25s ease;
    }
    .brand{
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .brand h1{
      margin:0;
      font-size: clamp(22px, 3.2vw, 34px);
      letter-spacing: .2px;
      line-height:1.1;
    }
    .brand p{
      margin:0;
      color: var(--muted);
      max-width: 62ch;
      transition: max-height .25s ease, opacity .25s ease;
    }

    .controls{
      display:flex;
      flex-wrap:wrap;
      justify-content:flex-end;
      gap:10px;
      align-items:center;
      margin-top: 2px;
      transition: max-height .25s ease, opacity .25s ease, margin .25s ease;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 10px 12px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 10px 24px rgba(0,0,0,.18);
      backdrop-filter: blur(10px);
      user-select:none;
    }

    button, .ghost{
      appearance:none;
      border: 1px solid rgba(255,255,255,.12);
      background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.04));
      color: var(--ink);
      border-radius: 999px;
      padding: 10px 12px;
      cursor:pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.18);
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
      backdrop-filter: blur(10px);
      font-weight: 600;
      letter-spacing:.2px;
    }
    button:hover{ transform: translateY(-1px); border-color: rgba(122,167,255,.35); }
    button:active{ transform: translateY(0px) scale(.99); }
    button:focus-visible{ outline:none; box-shadow: var(--ring), 0 10px 24px rgba(0,0,0,.18); }

    .toggle{
      display:flex; gap:8px; align-items:center;
    }
    .toggle input{
      width: 44px; height: 26px;
      appearance:none;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      position:relative;
      cursor:pointer;
      transition: background .15s ease, border-color .15s ease;
    }
    .toggle input:checked{
      background: rgba(125,255,178,.18);
      border-color: rgba(125,255,178,.35);
    }
    .toggle input::after{
      content:"";
      position:absolute; top:3px; left:3px;
      width: 18px; height: 18px; border-radius: 50%;
      background: rgba(255,255,255,.85);
      transition: transform .15s ease;
      box-shadow: 0 8px 16px rgba(0,0,0,.22);
    }
    .toggle input:checked::after{ transform: translateX(18px); }
    .toggle label{ color: var(--muted); font-weight: 600; }

.stage{
  position:relative;
  z-index:2;
  height: calc(100svh - var(--headerH));
  max-width: 1100px;
  margin: 0 auto;
  padding: 10px 12px calc(18px + var(--footerPad) + var(--safeB));
}


    .hintbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      color: var(--muted);
      font-size: 13px;
      padding: 8px 6px 12px;
    }
    .hintbar .left{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .kbd{
      font: 12px/1.1 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.25);
      color: rgba(255,255,255,.85);
    }

    /* floating cards */
    .card{
      position:absolute;
    /*  width: min(320px, 78vw); */
      transition: opacity .35s ease;
      border-radius: var(--radius);
      background: linear-gradient(180deg, var(--card), var(--card2));
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      overflow:hidden;
      user-select:none;
      touch-action: none; /* allows smooth dragging on touch */
    }
    .card::before{
      content:"";
      position:absolute; inset:0;
      background: radial-gradient(500px 220px at 20% 0%, rgba(122,167,255,.18), transparent 55%),
                  radial-gradient(420px 220px at 80% 20%, rgba(125,255,178,.12), transparent 60%);
      opacity:.85;
      pointer-events:none;
    }
    .card .inner{
      position:relative;
      padding: 14px 14px 12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .toprow{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 10px;
    }
    .title{
      display:flex; flex-direction:column; gap:4px;
      min-width: 0;
    }
    .title strong{
      font-size: 16px;
      letter-spacing:.2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .title span{
      color: var(--muted);
      font-size: 13px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .tag{
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      color: rgba(255,255,255,.88);
      flex: 0 0 auto;
    }
    .tag.word{ border-color: rgba(122,167,255,.28); }
    .tag.action{ border-color: rgba(125,255,178,.26); }
    .tag.puzzle{ border-color: rgba(255,107,136,.25); }

    .desc{
      margin:0;
      color: color-mix(in srgb, var(--ink) 88%, transparent);
      font-size: 13.5px;
    }

    .actions{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      padding-top: 4px;
    }
    a.play{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 12px;
      text-decoration:none;
      color: var(--ink);
      border: 1px solid rgba(255,255,255,.14);
      background: linear-gradient(180deg, rgba(122,167,255,.18), rgba(122,167,255,.06));
      box-shadow: 0 12px 24px rgba(0,0,0,.22);
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
      font-weight: 800;
      letter-spacing: .2px;
      flex: 1 1 auto;
      justify-content:center;
    }
    a.play:hover{ transform: translateY(-1px); border-color: rgba(122,167,255,.45); }
    a.play:active{ transform: translateY(0px) scale(.99); }
    a.play:focus-visible{ outline:none; box-shadow: var(--ring), 0 12px 24px rgba(0,0,0,.22); }

    .play-label-title{ display:none; }

    .mini{
      flex: 0 0 auto;
      display:flex;
      gap:8px;
    }
    .mini button{
      padding: 10px 11px;
      border-radius: 12px;
      font-weight: 800;
      min-width: 44px;
    }

    .card.is-focused{
      border-color: rgba(122,167,255,.35);
      box-shadow: 0 0 0 1px rgba(122,167,255,.20), var(--shadow);
    }

    /* footer strip */
.footer{
  position:fixed;
  left:0; right:0; bottom:0;
  z-index:3;
  padding: 10px 12px calc(14px + var(--safeB));
  pointer-events:none;
}
    .footer .bar{
      max-width: 1100px;
      margin: 0 auto;
      pointer-events:auto;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      padding: 10px 12px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 28px rgba(0,0,0,.25);
      color: var(--muted);
      font-size: 13px;
      transition: padding .25s ease, opacity .25s ease;
    }
    .footer .bar .stat{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    body.ui-minimized header{
      padding-top: 12px;
      padding-bottom: 4px;
      opacity: .86;
    }

    body.ui-minimized .brand h1{
      font-size: clamp(19px, 2.6vw, 24px);
    }

    body.ui-minimized .brand p,
    body.ui-minimized .controls{
      max-height: 0;
      opacity: 0;
      margin-top: 0;
      overflow: hidden;
      pointer-events: none;
    }

    body.ui-minimized .footer .bar{
      padding-top: 6px;
      padding-bottom: 6px;
      opacity: .82;
    }

    body.ui-minimized .footer .bar .stat:last-child{
      display: none;
    }
    .dot{
      width:9px; height:9px; border-radius:50%;
      background: rgba(125,255,178,.75);
      box-shadow: 0 0 0 3px rgba(125,255,178,.12);
    }

    body[data-theme="day"] .pill,
    body[data-theme="day"] button,
    body[data-theme="day"] .ghost,
    body[data-theme="day"] .tag,
    body[data-theme="day"] .kbd,
    body[data-theme="day"] a.play,
    body[data-theme="day"] .footer .bar{
      border-color: rgba(47,105,255,.18);
      box-shadow: 0 10px 24px rgba(24,53,112,.12);
    }

    body[data-theme="day"] .toggle input{
      background: rgba(47,105,255,.12);
      border-color: rgba(47,105,255,.26);
    }

    body[data-theme="day"] .toggle input::after{
      background: #fff;
    }

    /* reduced motion support */
@media (max-width: 520px){
  .card .inner{ padding: 10px 10px 8px; gap: 6px; }
  .toprow{ gap: 6px; }

  .card .title span{ display:none; }
  .title strong{ font-size: 15px; }

  .tag{ font-size: 11px; padding: 4px 8px; }

  a.play{
    padding: 8px 10px;
    font-size: 14px;
    border-radius: 10px;
  }

  .mini{ display:none; }

  /* description collapses unless focused */
  .card .desc{
    display:block;
    max-height: 0;
    opacity: 0;
    overflow:hidden;
    transition: max-height .2s ease, opacity .2s ease;
  }
  .card.is-focused .desc{
    max-height: 220px;
    opacity: 1;
  }
}

@media (max-width: 380px){
  .card .inner{
    padding: 8px;
    gap: 8px;
  }

  .card .toprow,
  .card .desc{
    display:none;
  }

  .actions{
    padding-top: 0;
  }

  a.play{
    min-height: 50px;
    padding: 6px 8px;
    font-size: 13px;
    border-radius: 9px;
    gap: 6px;
  }

  .play-label-default,
  .play-arrow{
    display:none;
  }

  .play-label-title{
    display:inline;
  }
}

  </style>
</head>

  <div class="grid" aria-hidden="true"></div>

      <p>Floating links to your projects. Drag cards around, hit “Shuffle” to remix the layout, or toggle autopilot.</p>
    </div>

    <div class="controls">
      <button id="shuffleBtn" type="button" title="Randomise positions (S)">Shuffle</button>
      <button id="gatherBtn" type="button" title="Gather cards to centre (G)">Gather</button>
      <div class="pill toggle" title="Let the cards drift on their own">
        <input id="autopilot" type="checkbox" />
        <label for="autopilot">Autopilot</label>
      </div>

      <div class="right">
        <span id="tip">Tip: click a card to bring it to the front.</span>
      </div>
    </div>
    <!-- cards injected by JS -->
  </main>

  <div class="footer">
    <div class="bar">
      <div class="stat">
        <span class="dot" aria-hidden="true"></span>
        <span id="status">Autopilot: On</span>
      </div>
      <div class="stat">
        <span id="count">0 games</span>
        <span>•</span>
        <span id="updated">Detecting local sky + weather…</span>
      </div>
    </div>

function clamp(v, a, b){
  return Math.max(a, Math.min(b, v));
}

function rand(a, b){
  return a + Math.random() * (b - a);
}

    function measureChrome(){
  const footerBar = document.querySelector(".footer .bar");
  const headerEl = document.querySelector("header");

  const footerH = footerBar ? footerBar.getBoundingClientRect().height : 72;
  const headerH = headerEl ? headerEl.getBoundingClientRect().height : 94;

  // extra breathing room so cards never touch the band
  const footerPad = footerH + 18;

  document.documentElement.style.setProperty("--footerPad", footerPad + "px");
  document.documentElement.style.setProperty("--headerH", headerH + "px");

  return { footerPad, headerH };
}

    // --- small helpers ---

let chromeMetrics = measureChrome();


    const inactivityDelayMs = 15000;
    const uiActivityEvents = ["pointerdown", "pointermove", "keydown", "wheel", "touchstart"];
    let uiMinimizeTimer = null;
    let uiIsMinimized = false;

    function setUiMinimized(minimized){
      uiIsMinimized = minimized;
      document.body.classList.toggle("ui-minimized", minimized);
      chromeMetrics = measureChrome();
      cards.forEach((s) => { if (!s.dragging) keepInBounds(s); sync(s); });
    }

    function scheduleUiMinimize(){
      clearTimeout(uiMinimizeTimer);
      uiMinimizeTimer = setTimeout(() => setUiMinimized(true), inactivityDelayMs);
    }

    function shouldPreserveMinimizedLayout(event){
      if (!event || !uiIsMinimized) return false;
      if (event.type !== "pointerdown" && event.type !== "touchstart") return false;

      const target = event.target;
      if (!(target instanceof Element)) return false;

      // Keep card interactions stable on compact mobile UI so taps don't jump.
      return Boolean(target.closest(".stage .card"));
    }

    function registerUiActivity(event){
      if (shouldPreserveMinimizedLayout(event)){
        scheduleUiMinimize();
        return;
      }

      if (uiIsMinimized){
        setUiMinimized(false);
      }
      scheduleUiMinimize();
    }

function weatherBucket(code){
  if (code === 0) return "clear";
  if ([1, 2, 3].includes(code)) return "cloudy";
  if ([45, 48].includes(code)) return "fog";
  if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return "rain";
  if ([71, 73, 75, 77, 85, 86].includes(code)) return "snow";
  if ([95, 96, 99].includes(code)) return "storm";
  return "clear";
}

function weatherLabel(code){
  const map = {
    0: "clear sky",
    1: "mostly clear",
    2: "partly cloudy",
    3: "overcast",
    45: "foggy",
    48: "icy fog",
    51: "light drizzle",
    53: "drizzle",
    55: "dense drizzle",
    56: "freezing drizzle",
    57: "dense freezing drizzle",
    61: "light rain",
    63: "rain",
    65: "heavy rain",
    66: "freezing rain",
    67: "heavy freezing rain",
    71: "light snow",
    73: "snow",
    75: "heavy snow",
    77: "snow grains",
    80: "rain showers",
    81: "rain showers",
    82: "heavy rain showers",
    85: "snow showers",
    86: "heavy snow showers",
    95: "thunderstorm",
    96: "thunderstorm + hail",
    99: "severe thunderstorm + hail"
  };
  return map[code] || "mixed weather";
}

function applySkyTheme(isDay, weatherCode, sourceText){
  const theme = isDay ? "day" : "night";
  const bucket = weatherBucket(weatherCode);
  document.body.dataset.theme = theme;
  document.body.dataset.weather = bucket;

  const period = isDay ? "Day mode" : "Night mode";
  const weather = weatherLabel(weatherCode);
  updatedEl.textContent = `${period} • ${weather} (${sourceText})`;
}

function fallbackSkyTheme(reason){
  const hour = new Date().getHours();
  const isDay = hour >= 7 && hour < 19;
  applySkyTheme(isDay, isDay ? 1 : 0, reason);
}

async function getApproxCoordsByIp(){
  const ipapi = await fetch("https://ipapi.co/json/", { cache: "no-store" });
  if (ipapi.ok){
    const data = await ipapi.json();
    if (Number.isFinite(Number(data.latitude)) && Number.isFinite(Number(data.longitude))){
      return {
        latitude: Number(data.latitude),
        longitude: Number(data.longitude),
        source: "IP weather"
      };
    }
  }

  const ipwhois = await fetch("https://ipwho.is/", { cache: "no-store" });
  if (ipwhois.ok){
    const data = await ipwhois.json();
    if (data.success && Number.isFinite(Number(data.latitude)) && Number.isFinite(Number(data.longitude))){
      return {
        latitude: Number(data.latitude),
        longitude: Number(data.longitude),
        source: "IP weather"
      };
    }
  }

  throw new Error("ip lookup failed");
}

async function updateSkyTheme(){
  try {
    const coords = await getApproxCoordsByIp();
    const latitude = coords.latitude.toFixed(4);
    const longitude = coords.longitude.toFixed(4);
    const endpoint = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=is_day,weather_code&timezone=auto`;

    const response = await fetch(endpoint, { cache: "no-store" });
    if (!response.ok) throw new Error("weather request failed");
    const data = await response.json();
    const current = data && data.current ? data.current : {};
    const isDay = Number(current.is_day) === 1;
    const weatherCode = Number(current.weather_code);

    applySkyTheme(isDay, weatherCode, coords.source);
  } catch {
    fallbackSkyTheme("local time fallback");
  }
}

    // z-index management so clicked/dragged cards come to front
    const baseZ = 1;
    let topZ = baseZ + GAMES.length + 5;

    // visibility cycling (show up to 7 cards at once, rotating over time)
    const visibilityCycleMs = 60000;
    const visibilityStartDelayMs = 1200;
    const maxVisibleCards = 7;
    const fadeFraction = 0.08;
    let visibilityStart = performance.now() + visibilityStartDelayMs;

    // motion state
    let autopilot = true;
    let raf = null;
    let lastT = performance.now();

    // Build cards
    const cards = [];
    countEl.textContent = `${GAMES.length} game${GAMES.length === 1 ? "" : "s"}`;

    function makeCard(game, idx){
      const el = document.createElement("section");
      el.className = "card";
      el.setAttribute("role", "group");
      el.setAttribute("aria-label", game.title);

      el.innerHTML = `
        <div class="inner">
          <div class="toprow">
            <div class="title">
              <strong title="${escapeHtml(game.title)}">${escapeHtml(game.title)}</strong>
              <span title="${escapeHtml(game.href)}">${escapeHtml(game.href)}</span>
            </div>
            <div class="tag ${game.tagClass || ""}">${escapeHtml(game.tag || "Game")}</div>
          </div>

          <p class="desc">${escapeHtml(game.desc || "Open the game.")}</p>

          <div class="actions">
            <a class="play" href="${encodeURI(game.href)}" target="_self" rel="noopener">
              <span class="play-label-default">Play</span>
              <span class="play-label-title">${escapeHtml(game.title)}</span>
              <span class="play-arrow" aria-hidden="true">→</span>
            </a>
            <div class="mini">
              <button type="button" class="nudge" title="Nudge">↺</button>
              <button type="button" class="pin" title="Pin/unpin">📌</button>
            </div>
          </div>
        </div>
      `;

      // initial position and velocity
      const rect = stage.getBoundingClientRect();
const cols =
  rect.width < 600 ? 1 :
  rect.width < 900 ? 2 :
  rect.width < 1200 ? 3 : 4;

const minWidth = rect.width < 520 ? 180 : 220;
const maxWidth = rect.width < 520 ? 240 : 320;

const targetWidth = clamp(
  rect.width / cols - 24,
  minWidth,
  maxWidth
);

el.style.width = targetWidth + "px";

      el.style.width = targetWidth + "px";
      

      // place roughly in a circle around centre
      const cx = rect.width / 2;
      const cy = (rect.height / 2) + 30;
      const angle = (idx / Math.max(1, GAMES.length)) * Math.PI * 2;
const density = Math.sqrt(GAMES.length);
const r = Math.min(rect.width, rect.height) * (0.22 + density * 0.02);
      
const state = {
  el,
  x: cx + Math.cos(angle) * r + rand(-40, 40),
  y: cy + Math.sin(angle) * r + rand(-30, 30),
  vx: rand(-18, 18),
  vy: rand(-16, 16),
  pinned: false,
  dragging: false,
  dragDX: 0,
  dragDY: 0,

  // ✅ swoop motion state
  curvePhase: Math.random() * Math.PI * 2,
  curveSpeed: 0.6 + Math.random() * 0.6,
  curveBiasX: rand(-1, 1),
  curveBiasY: rand(-1, 1)
};

      state.visibilityOrder = idx;
      state.visibilityOffset = 0;
      state.wasVisible = true;

      el.style.left = state.x + "px";
      el.style.top  = state.y + "px";
      el.style.zIndex = String(baseZ + idx);

      // bring to front on click
      el.addEventListener("pointerdown", (e) => {
        // allow normal click on the Play link
        if (e.target && (e.target.closest("a") || e.target.closest("button"))) return;
        bringToFront(state);
      });

      // drag support (pointer events)
      el.addEventListener("pointerdown", (e) => {
        const isUI = e.target && (e.target.closest("a") || e.target.closest("button"));
        if (isUI) return;

        bringToFront(state);
        state.dragging = true;
        state.el.classList.add("is-focused");

        const stageRect = stage.getBoundingClientRect();
        const px = e.clientX - stageRect.left;
        const py = e.clientY - stageRect.top;

        state.dragDX = state.x - px;
        state.dragDY = state.y - py;

        el.setPointerCapture(e.pointerId);
      });

      el.addEventListener("pointermove", (e) => {
        if (!state.dragging) return;

        const stageRect = stage.getBoundingClientRect();
        const px = e.clientX - stageRect.left;
        const py = e.clientY - stageRect.top;

        state.x = px + state.dragDX;
        state.y = py + state.dragDY;

        // damping while dragging
        state.vx *= 0.8;
        state.vy *= 0.8;

        keepInBounds(state);
        sync(state);
      });

      el.addEventListener("pointerup", () => {
        if (!state.dragging) return;
        state.dragging = false;
        state.el.classList.remove("is-focused");
      });

      // mini controls
      el.querySelector(".nudge").addEventListener("click", () => {
        bringToFront(state);
        // give it a little spin
        state.vx += rand(-60, 60);
        state.vy += rand(-55, 55);
      });

      const pinBtn = el.querySelector(".pin");
      pinBtn.addEventListener("click", () => {
        state.pinned = !state.pinned;
        pinBtn.textContent = state.pinned ? "📍" : "📌";
        pinBtn.title = state.pinned ? "Unpin" : "Pin";
        if (state.pinned){
          state.vx = 0; state.vy = 0;
        }
      });

      stage.appendChild(el);
      cards.push(state);
    }

function separationForce(self, all){
  let fx = 0;
  let fy = 0;

all.forEach(other => {
  if (!other.isVisible) return;
    if (other === self) return;

    const dx = self.x - other.x;
    const dy = self.y - other.y;
    const d2 = dx*dx + dy*dy;

const rect = stage.getBoundingClientRect();
const sepRadius = Math.min(rect.width, rect.height) * 0.35;

if (d2 < sepRadius * sepRadius && d2 > 1){
      const d = Math.sqrt(d2);
const strength = (sepRadius - d) / sepRadius;
      const push = strength * strength * 120; // quadratic ramp

      fx += (dx / d) * push;
      fy += (dy / d) * push;
    }
  });

  return { fx, fy };
}

function setAllVisible(){
  cards.forEach((s) => {
    s.isVisible = true;
    s.el.style.opacity = "1";
    s.el.style.pointerEvents = "auto";
    s.el.setAttribute("aria-hidden", "false");
    s.wasVisible = true;
  });
}

function visibilityOpacity(phase, visibleFraction){
  const local = ((phase % 1) + 1) % 1;
  if (local < visibleFraction){
    if (local < fadeFraction){
      return local / fadeFraction;
    }
    if (local > visibleFraction - fadeFraction){
      return (visibleFraction - local) / fadeFraction;
    }
    return 1;
  }
  return 0;
}

function updateVisibility(t){
  const elapsed = t - visibilityStart;
  if (elapsed < 0){
    setAllVisible();
    return;
  }

  const cyclePos = (elapsed % visibilityCycleMs) / visibilityCycleMs;
  const visibleFraction = Math.min(1, maxVisibleCards / Math.max(1, cards.length));
  const candidates = [];

  cards.forEach((s) => {
    if (s.dragging){
      s.pendingOpacity = 1;
      return;
    }
    s.pendingOpacity = visibilityOpacity(cyclePos + s.visibilityOffset, visibleFraction);
    candidates.push(s);
  });

  const visibleNonDraggingLimit = Math.max(0, maxVisibleCards - cards.filter((s) => s.dragging).length);
  const keepVisible = new Set(
    candidates
      .filter((s) => s.pendingOpacity > 0.02)
      .sort((a, b) => b.pendingOpacity - a.pendingOpacity)
      .slice(0, visibleNonDraggingLimit)
  );

  cards.forEach((s) => {
    const isDragged = s.dragging;
    const opacity = isDragged ? 1 : (keepVisible.has(s) ? s.pendingOpacity : 0);
    const isVisible = opacity > 0.02;

    s.isVisible = isVisible;
    s.el.style.opacity = opacity.toFixed(3);
    s.el.style.pointerEvents = isVisible ? "auto" : "none";
    s.el.setAttribute("aria-hidden", isVisible ? "false" : "true");

    if (isVisible !== s.wasVisible){
      s.el.style.zIndex = String(baseZ + s.visibilityOrder);
    }
    s.wasVisible = isVisible;
  });
}

    
    function bringToFront(state){
      state.el.style.zIndex = String(++topZ);
    }

function keepInBounds(s){
  const rect = stage.getBoundingClientRect();
  const cardRect = s.el.getBoundingClientRect();
  const w = cardRect.width;
  const h = cardRect.height;

  const footerReserve = (chromeMetrics && chromeMetrics.footerPad) ? chromeMetrics.footerPad : 86;

  const minX = w * 0.5 + 10;
  const maxX = rect.width - w * 0.5 - 10;

  // keep below hintbar area
  const minY = h * 0.5 + 60;

  // IMPORTANT: reserve space for the fixed footer band
  const maxY = rect.height - h * 0.5 - footerReserve;

  if (s.x < minX){ s.x = minX; s.vx *= -0.75; }
  if (s.x > maxX){ s.x = maxX; s.vx *= -0.75; }
  if (s.y < minY){ s.y = minY; s.vy *= -0.75; }
  if (s.y > maxY){ s.y = maxY; s.vy *= -0.75; }
}

function sync(s){
  const rect = s.el.getBoundingClientRect();
  s.el.style.left = (s.x - rect.width / 2) + "px";
  s.el.style.top  = (s.y - rect.height / 2) + "px";
}

    function shuffle(){
      const rect = stage.getBoundingClientRect();
      const cx = rect.width / 2;
      const cy = rect.height / 2 + 35;

      cards.forEach((s, i) => {
        bringToFront(s);
        if (s.pinned) return;

        const angle = rand(0, Math.PI * 2);
        const r = rand(40, Math.min(rect.width, rect.height) * 0.36);
        s.x = cx + Math.cos(angle) * r + rand(-40, 40);
        s.y = cy + Math.sin(angle) * r + rand(-30, 30);
        s.vx = rand(-55, 55);
        s.vy = rand(-48, 48);
        keepInBounds(s);
        sync(s);
      });
    }

    function gather(){
      const rect = stage.getBoundingClientRect();
      const cx = rect.width / 2;
      const cy = rect.height / 2 + 35;

      const spacing = 22;
      const cols = rect.width < 700 ? 1 : 2;

      let row = 0, col = 0;

      cards.forEach((s) => {
        bringToFront(s);
        if (s.pinned) return;

        const slotX = cx + (col - (cols - 1)/2) * (340 + spacing);
        const slotY = cy + (row - 0.5) * (170 + spacing);

        s.vx += (slotX - s.x) * 0.7;
        s.vy += (slotY - s.y) * 0.7;

        col++;
        if (col >= cols){ col = 0; row++; }
      });
    }

    function tick(t){
      if (!autopilot){
        raf = null;
        return;
      }

      const dt = Math.min(0.033, (t - lastT) / 1000);
      lastT = t;

      updateVisibility(t);

if (autopilot){
  cards.forEach((s) => {
    if (!s.isVisible) return;      // ✅ invisible = frozen
    if (s.pinned || s.dragging) return;

    // advance internal phase
    s.curvePhase += s.curveSpeed * dt;

    // long-form drift direction (very slow rotation)
    const driftAngle =
      Math.sin(s.curvePhase * 0.12 + s.curveBiasX) * Math.PI;

    const driftX = Math.cos(driftAngle) * 22;
    const driftY = Math.sin(driftAngle) * 22;

    // wide swooping forces
const scale = Math.min(stage.clientWidth, stage.clientHeight) / 900;

const swoopX =
  Math.sin(s.curvePhase) * 55 * scale +
  Math.sin(s.curvePhase * 0.27 + s.curveBiasX) * 28 * scale;


const swoopY =
  Math.sin(s.curvePhase) * 55 * scale +
  Math.sin(s.curvePhase * 0.27 + s.curveBiasY) * 28 * scale;

// separation from other cards
const sep = separationForce(s, cards);

// combine forces
s.vx += (swoopX + driftX + sep.fx) * dt;
s.vy += (swoopY + driftY + sep.fy) * dt;

    // softer damping = more freedom
    s.vx *= 0.965;
    s.vy *= 0.965;

    // integrate
    s.x += s.vx * dt;
    s.y += s.vy * dt;

    keepInBounds(s);
if (s.isVisible) sync(s);
  });
}


      raf = requestAnimationFrame(tick);
    }

    function setAutopilot(on){
      autopilot = on;
      statusEl.textContent = `Autopilot: ${autopilot ? "On" : "Off"}`;
      document.querySelector(".dot").style.background = autopilot ? "rgba(125,255,178,.75)" : "rgba(255,255,255,.35)";
      document.querySelector(".dot").style.boxShadow = autopilot ? "0 0 0 3px rgba(125,255,178,.12)" : "0 0 0 3px rgba(255,255,255,.10)";

      if (!autopilot){
        if (raf){
          cancelAnimationFrame(raf);
          raf = null;
        }
        setAllVisible();
        return;
      }

      if (!raf){
        lastT = performance.now();
        raf = requestAnimationFrame(tick);
      }
    }

function shuffleArray(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

    
    function escapeHtml(str){
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function assignVisibilityOffsets(){
    const ordered = [...cards].sort(
      (a, b) => Number(b.el.style.zIndex) - Number(a.el.style.zIndex)
    );
    ordered.forEach((s, i) => {
      s.visibilityOrder = i;
      s.visibilityOffset = i / Math.max(1, cards.length);
    });
  }

    // create all cards
shuffleArray(GAMES);
    GAMES.forEach(makeCard);
    assignVisibilityOffsets();

    // buttons
    shuffleBtn.addEventListener("click", shuffle);
    gatherBtn.addEventListener("click", gather);

    autopilotToggle.addEventListener("change", () => setAutopilot(autopilotToggle.checked));

    // keyboard shortcuts
    window.addEventListener("keydown", (e) => {
      if (e.key === "s" || e.key === "S"){ shuffle(); }
      if (e.key === "g" || e.key === "G"){ gather(); }
      if (e.key === "a" || e.key === "A"){
        autopilotToggle.checked = !autopilotToggle.checked;
        setAutopilot(autopilotToggle.checked);
      }
    });

    // keep layout sane on resize
    let resizeTimer = null;window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    chromeMetrics = measureChrome();
    cards.forEach((s) => { if (!s.dragging) keepInBounds(s); sync(s); });
  }, 120);
});



    uiActivityEvents.forEach((eventName) => {
      window.addEventListener(eventName, registerUiActivity, { passive: true });
    });


    // start with a little motion, then settle
shuffle();
autopilotToggle.checked = true;
setAutopilot(true);
scheduleUiMinimize();
updateSkyTheme();
setInterval(updateSkyTheme, 20 * 60 * 1000);
