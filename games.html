<html lang="en">
<head>

<style>
:root{
  --bg:#070913;
  --card:#101736cc;
  --ink:#eef1ff;
  --muted:#b6c0ff;
  --accent:#7aa7ff;
  --radius:18px;
}

html,body{
  margin:0;
  height:100%;
  background:
    radial-gradient(900px 600px at 20% 10%, #1a2a5a 0%, transparent 60%),
    radial-gradient(700px 600px at 80% 80%, #163b2a 0%, transparent 60%),
    var(--bg);
  font-family: system-ui, sans-serif;
  overflow:hidden;
  color:var(--ink);
}

h1{
  position:fixed;
  top:16px;
  left:50%;
  transform:translateX(-50%);
  font-size:clamp(22px,3vw,32px);
  letter-spacing:.3px;
  z-index:5;
}

.stage{
  position:absolute;
  inset:0;
}

.card{
  position:absolute;
  width:260px;
  border-radius:var(--radius);
  background:linear-gradient(180deg,var(--card),#0b1128cc);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(10px);
  padding:16px;
  box-shadow:0 20px 40px rgba(0,0,0,.45);
  user-select:none;
}

.card strong{
  display:block;
  font-size:18px;
  margin-bottom:6px;
}

.card p{
  margin:0 0 14px;
  font-size:14px;
  color:var(--muted);
}

.card a{
  display:inline-block;
  text-decoration:none;
  font-weight:700;
  padding:10px 14px;
  border-radius:12px;
  background:linear-gradient(180deg,#7aa7ff,#5b86ff);
  color:#060914;
}

.card a:hover{
  filter:brightness(1.1);
}
</style>
</head>
