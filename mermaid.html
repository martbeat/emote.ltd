<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mermaid Studio+</title><style>
:root {
  --bg:#0b0f1a;--panel:#12182b;--panel2:#18213a;--border:#2b3a6b;
  --text:#eef2ff;--muted:#9aa6d1;--accent:#6ea8ff;
}
body{margin:0;font-family:Inter,sans-serif;background:linear-gradient(#0a0f1f,#0e1530);color:var(--text);display:flex;flex-direction:column;height:100vh}
header{padding:12px;border-bottom:1px solid var(--border)}
.app{flex:1;display:flex;min-height:0}
.pane{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--border)}
.editor{width:40%;min-width:260px}
.preview{flex:1}
.resizer{width:6px;cursor:col-resize;background:var(--border)}
.toolbar{padding:8px;border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap}
button,select{padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer}
textarea{flex:1;border:none;outline:none;background:transparent;color:var(--text);padding:10px;font-family:monospace}
.preview-area{flex:1;overflow:auto;padding:15px}
.status{padding:6px;border-top:1px solid var(--border);font-size:.8rem;color:var(--muted)}
</style></head>
<body>
<header><strong>Mermaid Studio+</strong></header>
<div class="app"><div class="pane editor" id="editorPane">
<div class="toolbar">
<button id="render">Render</button>
<button id="share">Share</button>
<button id="embed">Embed</button>
<select id="theme">
<option value="dark" selected>Dark</option>
<option value="default">Default</option>
</select>
</div>
<textarea id="code"></textarea>
</div><div class="resizer" id="resizer"></div><div class="pane preview">
<div class="toolbar">
<button id="svg">SVG</button>
<button id="png">PNG</button>
</div>
<div class="preview-area" id="output"></div>
<div class="status" id="status">Ready</div>
</div></div><script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

const codeEl = document.getElementById('code');
const output = document.getElementById('output');
const status = document.getElementById('status');
const theme = document.getElementById('theme');
const renderBtn = document.getElementById('render');
let hasErrorStatus = false;

// --- persistence ---
const STORAGE_KEY = "mermaid_code";

function setStatus(message,{error=false} = {}){
  status.textContent = message;
  hasErrorStatus = error;
}

function clearErrorStatus(){
  if(hasErrorStatus){
    setStatus('Ready');
  }
}

function loadState(){
  const saved = localStorage.getItem(STORAGE_KEY);
  const url = new URLSearchParams(location.search).get('c');
  if(url){
    try{
      codeEl.value = decodeMermaidCode(url);
    }catch{
      codeEl.value = saved || "flowchart TD\nA-->B\nB-->C";
      setStatus("Warning: invalid shared URL data",{error:true});
    }
  } else if(saved){
    codeEl.value = saved;
  } else {
    codeEl.value = "flowchart TD\nA-->B\nB-->C";
  }
}

function saveState(){
  localStorage.setItem(STORAGE_KEY, codeEl.value);
}

// --- render ---
function init(){
  mermaid.initialize({
    startOnLoad:false,
    theme:theme.value,
    securityLevel:'strict',
    flowchart:{
      htmlLabels:false
    }
  });
}

function encodeMermaidCode(text){
  const bytes = new TextEncoder().encode(text);
  let binary = '';
  for(const byte of bytes){
    binary += String.fromCharCode(byte);
  }
  return btoa(binary)
    .replace(/\+/g, '-')
    .replace(/\//g, '_')
    .replace(/=+$/g, '');
}

function decodeMermaidCode(encoded){
  const normalized = encoded
    .replace(/-/g, '+')
    .replace(/_/g, '/');
  const padded = normalized + '='.repeat((4 - (normalized.length % 4)) % 4);
  const binary = atob(padded);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++){
    bytes[i] = binary.charCodeAt(i);
  }
  return new TextDecoder().decode(bytes);
}

async function copyToClipboard(text){
  if (navigator.clipboard?.writeText) {
    await navigator.clipboard.writeText(text);
    return;
  }

  const temp = document.createElement('textarea');
  temp.value = text;
  temp.style.position = 'fixed';
  temp.style.opacity = '0';
  document.body.appendChild(temp);
  temp.focus();
  temp.select();
  const ok = document.execCommand('copy');
  document.body.removeChild(temp);
  if(!ok){
    throw new Error('Clipboard not available');
  }
}

async function render(){
  try{
    init();
    const {svg} = await mermaid.render('m'+Date.now(), codeEl.value);
    output.innerHTML = svg;
    setStatus("Rendered");
    saveState();
  }catch(e){
    setStatus("Error: "+e.message,{error:true});
  }
}

// --- debounce auto render ---
let timer;
codeEl.addEventListener('input',()=>{
  clearTimeout(timer);
  timer = setTimeout(render,500);
});

renderBtn.onclick = render;
theme.onchange = render;

// --- share link ---
document.getElementById('share').onclick = async ()=>{
  const encoded = encodeMermaidCode(codeEl.value);
  const url = new URL(location.href);
  url.searchParams.set('c', encoded);
  try{
    await copyToClipboard(url.toString());
    setStatus("Share link copied");
  }catch{
    setStatus("Could not copy share link",{error:true});
  }
};

// --- embed ---
document.getElementById('embed').onclick = async ()=>{
  const encoded = encodeMermaidCode(codeEl.value);
  const url = new URL(location.href);
  url.searchParams.set('c', encoded);
  const iframe = `<iframe src="${url.toString()}" width="100%" height="400"></iframe>`;
  try{
    await copyToClipboard(iframe);
    setStatus("Embed code copied");
  }catch{
    setStatus("Could not copy embed code",{error:true});
  }
};

// --- exports ---
document.getElementById('svg').onclick = ()=>{
  const svg = output.querySelector('svg');
  if(!svg){
    setStatus("Error: nothing to export",{error:true});
    return;
  }
  const blob = new Blob([svg.outerHTML],{type:'image/svg+xml'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='chart.svg';
  a.click();
  clearErrorStatus();
};

document.getElementById('png').onclick = ()=>{
  const svg = output.querySelector('svg');
  if(!svg){
    setStatus("Error: nothing to export",{error:true});
    return;
  }
  const img = new Image();
  const scale = 3; // high-resolution export for better readability
  const clonedSvg = svg.cloneNode(true);
  const box = svg.viewBox?.baseVal;
  const width = box?.width || svg.getBoundingClientRect().width || 1200;
  const height = box?.height || svg.getBoundingClientRect().height || 800;

  clonedSvg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  clonedSvg.setAttribute('width', width);
  clonedSvg.setAttribute('height', height);
  if (!clonedSvg.getAttribute('viewBox')) {
    clonedSvg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  }

  const blob = new Blob([clonedSvg.outerHTML], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(width * scale);
    canvas.height = Math.ceil(height * scale);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, width, height);
    ctx.drawImage(img, 0, 0, width, height);

    try{
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = 'chart.png';
      a.click();
      clearErrorStatus();
    }catch(error){
      setStatus("Error: PNG export blocked by browser security. Remove external images/HTML labels and try again.",{error:true});
      console.error(error);
    }finally{
      URL.revokeObjectURL(url);
    }
  };
  img.onerror = () => {
    URL.revokeObjectURL(url);
    setStatus("Error: PNG export failed",{error:true});
  };
  img.src = url;
};

// --- resize ---
const resizer=document.getElementById('resizer');
const editor=document.getElementById('editorPane');
resizer.onmousedown=()=>{
  document.onmousemove=e=>editor.style.width=e.clientX+'px';
  document.onmouseup=()=>document.onmousemove=null;
};

// init
loadState();
render();
</script></body>
</html>
