<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mermaid Studio+</title><style>
:root {
  --bg:#0b0f1a;--panel:#12182b;--panel2:#18213a;--border:#2b3a6b;
  --text:#eef2ff;--muted:#9aa6d1;--accent:#6ea8ff;
}
body{margin:0;font-family:Inter,sans-serif;background:linear-gradient(#0a0f1f,#0e1530);color:var(--text);display:flex;flex-direction:column;height:100vh}
header{padding:12px;border-bottom:1px solid var(--border)}
.app{flex:1;display:flex;min-height:0}
.pane{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--border)}
.editor{width:40%;min-width:260px}
.preview{flex:1}
.resizer{width:6px;cursor:col-resize;background:var(--border)}
.toolbar{padding:8px;border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap}
button,select{padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer}
input{padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text)}
textarea{flex:1;border:none;outline:none;background:transparent;color:var(--text);padding:10px;font-family:monospace}
.preview-area{flex:1;overflow:auto;padding:15px}
.render-canvas{display:inline-block;transform-origin:0 0;cursor:grab}
.render-canvas.dragging{cursor:grabbing}
.status{padding:6px;border-top:1px solid var(--border);font-size:.8rem;color:var(--muted)}
</style></head>
<body>
<header><strong>Mermaid Studio+</strong></header>
<div class="app"><div class="pane editor" id="editorPane">
<div class="toolbar">
<button id="render">Render</button>
<button id="share">Share</button>
<button id="embed">Embed</button>
<input id="diagramName" placeholder="Diagram name" value="" />
<button id="saveDiagram">Save</button>
<select id="savedDiagrams"></select>
<button id="loadDiagram">Load</button>
<button id="deleteDiagram">Delete</button>
<select id="theme">
<option value="dark" selected>Dark</option>
<option value="default">Default</option>
<option value="neutral">Neutral</option>
<option value="forest">Forest</option>
<option value="base">Base</option>
<option value="midnight">Midnight</option>
<option value="sunset">Sunset</option>
<option value="ocean">Ocean</option>
<option value="slate">Slate</option>
<option value="rose">Rose</option>
</select>
</div>
<textarea id="code"></textarea>
</div><div class="resizer" id="resizer"></div><div class="pane preview">
<div class="toolbar">
<button id="svg">SVG</button>
<button id="png">PNG</button>
<button id="zoomOut" title="Zoom out">-</button>
<button id="zoomIn" title="Zoom in">+</button>
<button id="zoomReset" title="Reset zoom">100%</button>
</div>
<div class="preview-area" id="output"></div>
<div class="status" id="status">Ready</div>
</div></div><script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
import { Canvg } from 'https://cdn.jsdelivr.net/npm/canvg@4/+esm';

const codeEl = document.getElementById('code');
const output = document.getElementById('output');
const status = document.getElementById('status');
const theme = document.getElementById('theme');
const renderBtn = document.getElementById('render');
const diagramNameEl = document.getElementById('diagramName');
const savedDiagramsEl = document.getElementById('savedDiagrams');
const saveDiagramBtn = document.getElementById('saveDiagram');
const loadDiagramBtn = document.getElementById('loadDiagram');
const deleteDiagramBtn = document.getElementById('deleteDiagram');
const zoomInBtn = document.getElementById('zoomIn');
const zoomOutBtn = document.getElementById('zoomOut');
const zoomResetBtn = document.getElementById('zoomReset');
let hasErrorStatus = false;
let zoomLevel = 1;
let renderCanvas = null;
let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;
let scrollStartLeft = 0;
let scrollStartTop = 0;
let navigationBound = false;
const THEME_PRESETS = {
  dark: { theme: 'dark', isDark: true },
  default: { theme: 'default', isDark: false },
  neutral: { theme: 'neutral', isDark: false },
  forest: { theme: 'forest', isDark: false },
  base: { theme: 'base', isDark: false },
  midnight: {
    theme: 'base',
    isDark: true,
    themeVariables: {
      background: '#020617',
      primaryColor: '#1e293b',
      primaryTextColor: '#e2e8f0',
      primaryBorderColor: '#334155',
      lineColor: '#7dd3fc',
      tertiaryColor: '#0f172a'
    }
  },
  sunset: {
    theme: 'base',
    isDark: false,
    themeVariables: {
      background: '#fff7ed',
      primaryColor: '#fed7aa',
      primaryTextColor: '#7c2d12',
      primaryBorderColor: '#fb923c',
      lineColor: '#ea580c',
      tertiaryColor: '#ffedd5'
    }
  },
  ocean: {
    theme: 'base',
    isDark: false,
    themeVariables: {
      background: '#ecfeff',
      primaryColor: '#a5f3fc',
      primaryTextColor: '#155e75',
      primaryBorderColor: '#06b6d4',
      lineColor: '#0891b2',
      tertiaryColor: '#cffafe'
    }
  },
  slate: {
    theme: 'base',
    isDark: false,
    themeVariables: {
      background: '#f8fafc',
      primaryColor: '#e2e8f0',
      primaryTextColor: '#0f172a',
      primaryBorderColor: '#64748b',
      lineColor: '#334155',
      tertiaryColor: '#f1f5f9'
    }
  },
  rose: {
    theme: 'base',
    isDark: false,
    themeVariables: {
      background: '#fff1f2',
      primaryColor: '#fecdd3',
      primaryTextColor: '#881337',
      primaryBorderColor: '#f43f5e',
      lineColor: '#e11d48',
      tertiaryColor: '#ffe4e6'
    }
  }
};

// --- persistence ---
const STORAGE_KEY = "mermaid_code";
const FILESYSTEM_KEY = "mermaid_filesystem";
const LAST_FILE_KEY = "mermaid_last_file";

function sanitizeDiagramName(name){
  return name
    .trim()
    .toLowerCase()
    .replace(/[^a-z0-9-_ ]+/g, '')
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 60);
}

function getFilesystem(){
  try{
    const parsed = JSON.parse(localStorage.getItem(FILESYSTEM_KEY) || '{}');
    return parsed && typeof parsed === 'object' ? parsed : {};
  }catch{
    return {};
  }
}

function saveFilesystem(filesystem){
  localStorage.setItem(FILESYSTEM_KEY, JSON.stringify(filesystem));
}

function refreshSavedDiagramsList(selectedName=''){
  const filesystem = getFilesystem();
  const names = Object.keys(filesystem).sort((a,b)=>a.localeCompare(b));
  savedDiagramsEl.innerHTML = '';

  const placeholder = document.createElement('option');
  placeholder.value = '';
  placeholder.textContent = names.length ? 'Choose saved diagram' : 'No saved diagrams';
  savedDiagramsEl.appendChild(placeholder);

  for(const name of names){
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    savedDiagramsEl.appendChild(opt);
  }

  if(selectedName && names.includes(selectedName)){
    savedDiagramsEl.value = selectedName;
  }else{
    savedDiagramsEl.value = '';
  }
}

function saveCurrentDiagramToFilesystem(){
  const fallbackName = inferDiagramName(codeEl.value);
  const sanitizedName = sanitizeDiagramName(diagramNameEl.value || fallbackName);
  if(!sanitizedName){
    setStatus('Error: provide a valid diagram name',{error:true});
    return null;
  }

  const filesystem = getFilesystem();
  filesystem[sanitizedName] = {
    code: codeEl.value,
    updatedAt: new Date().toISOString()
  };
  saveFilesystem(filesystem);
  localStorage.setItem(LAST_FILE_KEY, sanitizedName);
  diagramNameEl.value = sanitizedName;
  refreshSavedDiagramsList(sanitizedName);
  return sanitizedName;
}

function loadDiagramFromFilesystem(name){
  const filesystem = getFilesystem();
  const entry = filesystem[name];
  if(!entry?.code){
    setStatus(`Error: diagram "${name}" not found`,{error:true});
    return;
  }
  codeEl.value = entry.code;
  diagramNameEl.value = name;
  localStorage.setItem(LAST_FILE_KEY, name);
  refreshSavedDiagramsList(name);
  render();
}

function setStatus(message,{error=false} = {}){
  status.textContent = message;
  hasErrorStatus = error;
}

function clearErrorStatus(){
  if(hasErrorStatus){
    setStatus('Ready');
  }
}

function applyZoom(){
  if(!renderCanvas){
    return;
  }
  renderCanvas.style.transform = `scale(${zoomLevel})`;
}

function setZoom(nextZoom){
  zoomLevel = Math.min(4, Math.max(0.3, nextZoom));
  applyZoom();
}

function setupCanvasNavigation(){
  if(!renderCanvas || navigationBound){
    return;
  }
  navigationBound = true;

  output.addEventListener('mousedown',(event)=>{
    if(!event.target.closest('.render-canvas')){
      return;
    }
    isDragging = true;
    dragStartX = event.clientX;
    dragStartY = event.clientY;
    scrollStartLeft = output.scrollLeft;
    scrollStartTop = output.scrollTop;
    renderCanvas?.classList.add('dragging');
    event.preventDefault();
  });

  window.addEventListener('mouseup',()=>{
    isDragging = false;
    renderCanvas?.classList.remove('dragging');
  });

  output.addEventListener('mousemove',(event)=>{
    if(!isDragging){
      return;
    }
    const deltaX = event.clientX - dragStartX;
    const deltaY = event.clientY - dragStartY;
    output.scrollLeft = scrollStartLeft - deltaX;
    output.scrollTop = scrollStartTop - deltaY;
  });
}

function loadState(){
  const saved = localStorage.getItem(STORAGE_KEY);
  const lastFile = localStorage.getItem(LAST_FILE_KEY);
  const filesystem = getFilesystem();
  const url = new URLSearchParams(location.search).get('c');
  const urlName = sanitizeDiagramName(new URLSearchParams(location.search).get('n') || '');
  if(url){
    try{
      codeEl.value = decodeMermaidCode(url);
      diagramNameEl.value = urlName || inferDiagramName(codeEl.value);
    }catch{
      codeEl.value = saved || "flowchart TD\nA-->B\nB-->C";
      diagramNameEl.value = lastFile || inferDiagramName(codeEl.value);
      setStatus("Warning: invalid shared URL data",{error:true});
    }
  } else if(lastFile && filesystem[lastFile]?.code){
    codeEl.value = filesystem[lastFile].code;
    diagramNameEl.value = lastFile;
  } else if(saved){
    codeEl.value = saved;
    diagramNameEl.value = inferDiagramName(codeEl.value);
  } else {
    codeEl.value = "flowchart TD\nA-->B\nB-->C";
    diagramNameEl.value = 'diagram-1';
  }
  refreshSavedDiagramsList(diagramNameEl.value);
}

function saveState(){
  localStorage.setItem(STORAGE_KEY, codeEl.value);
  if(diagramNameEl.value){
    localStorage.setItem(LAST_FILE_KEY, sanitizeDiagramName(diagramNameEl.value));
  }
}

function getThemePreset(){
  return THEME_PRESETS[theme.value] || THEME_PRESETS.dark;
}

// --- render ---
function init(){
const preset = getThemePreset();
mermaid.initialize({
  startOnLoad:false,
  theme:preset.theme,
  themeVariables:preset.themeVariables,
  securityLevel:'loose',
  suppressErrorRendering:true,
  flowchart:{
    htmlLabels:false
  }
});
}

function encodeMermaidCode(text){
  const bytes = new TextEncoder().encode(text);
  let binary = '';
  for(const byte of bytes){
    binary += String.fromCharCode(byte);
  }
  return btoa(binary)
    .replace(/\+/g, '-')
    .replace(/\//g, '_')
    .replace(/=+$/g, '');
}

function decodeMermaidCode(encoded){
  const normalized = encoded
    .replace(/-/g, '+')
    .replace(/_/g, '/');
  const padded = normalized + '='.repeat((4 - (normalized.length % 4)) % 4);
  const binary = atob(padded);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++){
    bytes[i] = binary.charCodeAt(i);
  }
  return new TextDecoder().decode(bytes);
}

function inferDiagramName(text){
  const firstMeaningfulLine = text
    .split('\n')
    .map((line)=>line.trim())
    .find((line)=>line && !line.startsWith('%%')) || 'diagram';
  return firstMeaningfulLine
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 40) || 'diagram';
}

function buildShareURL(encoded){
  const url = new URL(location.href);
  const today = new Date().toISOString().slice(0,10);
  const name = inferDiagramName(codeEl.value);
  url.search = '';
  url.searchParams.set('d', today);
  url.searchParams.set('n', name);
  url.searchParams.set('c', encoded);
  return url;
}

function isSafeSvgReference(ref){
  if(!ref){
    return true;
  }
  if(ref.startsWith('#') || ref.startsWith('data:') || ref.startsWith('blob:')){
    return true;
  }
  try{
    const parsed = new URL(ref, location.href);
    return parsed.origin === location.origin;
  }catch{
    return false;
  }
}

function sanitizeSvgForPng(svgElement){
  const withHref = svgElement.querySelectorAll('[href], [xlink\\:href]');
  for(const node of withHref){
    const href = node.getAttribute('href') || node.getAttribute('xlink:href');
    if(!isSafeSvgReference(href)){
      if(node.tagName.toLowerCase() === 'image'){
        node.remove();
      }else{
        node.removeAttribute('href');
        node.removeAttribute('xlink:href');
      }
    }
  }
}

function prepareSvgForExport(svgElement){
  const clonedSvg = svgElement.cloneNode(true);
  const box = svgElement.viewBox?.baseVal;
  const width = box?.width || svgElement.getBoundingClientRect().width || 1200;
  const height = box?.height || svgElement.getBoundingClientRect().height || 800;

  clonedSvg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  clonedSvg.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
  clonedSvg.setAttribute('width', width);
  clonedSvg.setAttribute('height', height);

  if (!clonedSvg.getAttribute('viewBox')) {
    clonedSvg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  }

  sanitizeSvgForPng(clonedSvg);
  return { clonedSvg, width, height };
}

async function copyToClipboard(text){
  if (navigator.clipboard?.writeText) {
    await navigator.clipboard.writeText(text);
    return;
  }

  const temp = document.createElement('textarea');
  temp.value = text;
  temp.style.position = 'fixed';
  temp.style.opacity = '0';
  document.body.appendChild(temp);
  temp.focus();
  temp.select();
  const ok = document.execCommand('copy');
  document.body.removeChild(temp);
  if(!ok){
    throw new Error('Clipboard not available');
  }
}

async function render(){
  try{
    init();
    await document.fonts.ready;
    await mermaid.parse(codeEl.value, { suppressErrors: true });

    const {svg} = await mermaid.render('m'+Date.now(), codeEl.value);
    output.innerHTML = `<div class="render-canvas">${svg}</div>`;
    renderCanvas = output.querySelector('.render-canvas');
    applyZoom();
    setupCanvasNavigation();

    setStatus("Rendered");
    saveState();
  }catch(e){
    setStatus("Error: "+e.message,{error:true});
  }
}
// --- debounce auto render ---
let timer;
codeEl.addEventListener('input',()=>{
  clearTimeout(timer);
  timer = setTimeout(render,500);
});

renderBtn.onclick = render;
theme.onchange = render;
zoomInBtn.onclick = ()=>setZoom(zoomLevel * 1.2);
zoomOutBtn.onclick = ()=>setZoom(zoomLevel / 1.2);
zoomResetBtn.onclick = ()=>setZoom(1);

output.addEventListener('wheel',(event)=>{
  if(!event.ctrlKey){
    return;
  }
  event.preventDefault();
  const factor = event.deltaY < 0 ? 1.1 : 1 / 1.1;
  setZoom(zoomLevel * factor);
},{passive:false});

// --- share link ---
document.getElementById('share').onclick = async ()=>{
  const encoded = encodeMermaidCode(codeEl.value);
  const url = buildShareURL(encoded);
  try{
    await copyToClipboard(url.toString());
    setStatus("Share link copied");
  }catch{
    setStatus("Could not copy share link",{error:true});
  }
};

// --- embed ---
document.getElementById('embed').onclick = async ()=>{
  const encoded = encodeMermaidCode(codeEl.value);
  const url = buildShareURL(encoded);
  const iframe = `<iframe src="${url.toString()}" width="100%" height="400"></iframe>`;
  try{
    await copyToClipboard(iframe);
    setStatus("Embed code copied");
  }catch{
    setStatus("Could not copy embed code",{error:true});
  }
};

saveDiagramBtn.onclick = ()=>{
  const name = saveCurrentDiagramToFilesystem();
  if(name){
    setStatus(`Saved diagram as "${name}"`);
    saveState();
  }
};

loadDiagramBtn.onclick = ()=>{
  const name = savedDiagramsEl.value;
  if(!name){
    setStatus('Error: choose a saved diagram to load',{error:true});
    return;
  }
  loadDiagramFromFilesystem(name);
  setStatus(`Loaded diagram "${name}"`);
};

deleteDiagramBtn.onclick = ()=>{
  const name = savedDiagramsEl.value || sanitizeDiagramName(diagramNameEl.value);
  if(!name){
    setStatus('Error: choose a saved diagram to delete',{error:true});
    return;
  }
  const filesystem = getFilesystem();
  if(!filesystem[name]){
    setStatus(`Error: diagram "${name}" not found`,{error:true});
    return;
  }
  delete filesystem[name];
  saveFilesystem(filesystem);
  if(localStorage.getItem(LAST_FILE_KEY) === name){
    localStorage.removeItem(LAST_FILE_KEY);
  }
  refreshSavedDiagramsList();
  setStatus(`Deleted diagram "${name}"`);
};

// --- exports ---
// --- exports ---
function serializeSvg(svgElement){
  const serializer = new XMLSerializer();
  let source = serializer.serializeToString(svgElement);

  if(!source.match(/^<svg[^>]+xmlns="http:\/\/www\.w3\.org\/2000\/svg"/)){
    source = source.replace(
      /^<svg/,
      '<svg xmlns="http://www.w3.org/2000/svg"'
    );
  }

  if(!source.match(/^<svg[^>]+"http:\/\/www\.w3\.org\/1999\/xlink"/)){
    source = source.replace(
      /^<svg/,
      '<svg xmlns:xlink="http://www.w3.org/1999/xlink"'
    );
  }

  return source;
}
  
function inlineSvgStyles(sourceSvg, targetSvg){
  const sourceNodes = sourceSvg.querySelectorAll('*');
  const targetNodes = targetSvg.querySelectorAll('*');

  targetNodes.forEach((node, i)=>{
    const src = sourceNodes[i];
    if(!src) return;

    const style = getComputedStyle(src);

    if(style.fill) node.setAttribute("fill", style.fill);
    if(style.stroke) node.setAttribute("stroke", style.stroke);
    if(style.color) node.setAttribute("color", style.color);

    if(style.fontFamily) node.setAttribute("font-family", style.fontFamily);
    if(style.fontSize) node.setAttribute("font-size", style.fontSize);
    if(style.fontWeight) node.setAttribute("font-weight", style.fontWeight);
  });
}
  function cleanupSvg(svg){

  const cleanSvg = svg.cloneNode(true);

  const box = svg.viewBox?.baseVal;
  const width = box?.width || svg.clientWidth || 1200;
  const height = box?.height || svg.clientHeight || 800;

  cleanSvg.setAttribute('width', width);
  cleanSvg.setAttribute('height', height);

  if(!cleanSvg.getAttribute('viewBox')){
    cleanSvg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  }

  return { svg: cleanSvg, width, height };
}
  
document.getElementById('svg').onclick = ()=>{
  const svg = output.querySelector('svg');
  if(!svg){
    setStatus("Error: nothing to export",{error:true});
    return;
  }

  const {svg:cleanSvg} = cleanupSvg(svg);
  const source = serializeSvg(cleanSvg);

  const blob = new Blob(
    ['<?xml version="1.0" standalone="no"?>\n', source],
    {type:'image/svg+xml;charset=utf-8'}
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "diagram.svg";
  a.click();

  setTimeout(()=>URL.revokeObjectURL(url),100);
  clearErrorStatus();
};

document.getElementById('png').onclick = async ()=>{
  const svg = output.querySelector('svg');
  if(!svg){
    setStatus("Error: nothing to export",{error:true});
    return;
  }

  const scale = 3;

  const {svg:cleanSvg,width,height} = cleanupSvg(svg);
  const source = serializeSvg(cleanSvg);

  const canvas = document.createElement('canvas');
  canvas.width = width * scale;
  canvas.height = height * scale;

  const ctx = canvas.getContext('2d');
  ctx.setTransform(scale,0,0,scale,0,0);

  ctx.fillStyle = getThemePreset().isDark ? '#0b0f1a' : '#ffffff';
  ctx.fillRect(0,0,width,height);

  const img = new Image();

  const svg64 = btoa(unescape(encodeURIComponent(source)));
  const image64 = 'data:image/svg+xml;base64,' + svg64;

  img.onload = ()=>{
    ctx.drawImage(img,0,0,width,height);

    const a = document.createElement('a');
    a.href = canvas.toDataURL("image/png");
    a.download = "diagram.png";
    a.click();

    clearErrorStatus();
  };

  img.onerror = ()=>{
    setStatus("Error: PNG export failed",{error:true});
  };

  img.src = image64;
};
// --- resize ---
const resizer=document.getElementById('resizer');
const editor=document.getElementById('editorPane');
resizer.onmousedown=()=>{
  document.onmousemove=e=>editor.style.width=e.clientX+'px';
  document.onmouseup=()=>document.onmousemove=null;
};

// init
loadState();
render();
</script></body>
</html>
