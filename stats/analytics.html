<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Emote Analytics</title>
<style>
  :root { --bg:#f8fafc; --card:#fff; --text:#0f172a; --muted:#475569; --line:#e2e8f0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1020; --card:#111827; --text:#e5e7eb; --muted:#94a3b8; --line:#1f2937; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); }
  .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 12px; }
  .cards { display:grid; grid-template-columns: repeat(auto-fit,minmax(165px,1fr)); gap:10px; margin:14px 0 18px; }
  .card { background: var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .card small { color: var(--muted); display:block; margin-bottom:4px; }
  .card strong { font-size: 1.1rem; }
  .panel { background: var(--card); border:1px solid var(--line); border-radius:10px; margin-top:14px; overflow:hidden; }
  .panel h2 { margin:0; padding:10px 12px; border-bottom:1px solid var(--line); font-size:1rem; }
  .table-wrap { overflow:auto; }
  table { width:100%; min-width:520px; border-collapse: collapse; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; }
  th { color: var(--muted); font-size: .85rem; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:.92em; }
  .pct { color: var(--muted); margin-left: 6px; font-size: .84em; }
  .message { margin-top: 12px; padding: 10px 12px; border:1px dashed var(--line); border-radius:10px; background:var(--card); color:var(--muted); }
</style>
</head>
<body>
<main class="container">
  <h1>Emote Analytics</h1>
  <div id="range" class="sub">Loading analytics…</div>
  <div id="message" class="message">Loading <code>emote.json</code>…</div>
  <section id="cards" class="cards"></section>
  <section id="sections"></section>
  <noscript><div class="message">JavaScript is disabled; analytics requires JavaScript.</div></noscript>
</main>

<script>
(function () {
  const el = {
    range: document.getElementById('range'),
    cards: document.getElementById('cards'),
    sections: document.getElementById('sections'),
    message: document.getElementById('message')
  };

  const numberFmt = new Intl.NumberFormat();
  const byteFmt = new Intl.NumberFormat(undefined, { maximumFractionDigits: 1 });
  const flagCache = new Map();

  function safe(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  function showMessage(text) { el.message.innerHTML = text; }

  function metricValue(metric) {
    if (metric == null) return 0;
    if (typeof metric === 'number') return metric;
    if (typeof metric === 'string') return Number(metric) || 0;
    if (typeof metric === 'object') {
      if (typeof metric.count === 'number') return metric.count;
      if (typeof metric.count === 'string') return Number(metric.count) || 0;
      if (metric.count && typeof metric.count.value === 'number') return metric.count.value;
      if (metric.count && typeof metric.count.value === 'string') return Number(metric.count.value) || 0;
      if (typeof metric.value === 'number') return metric.value;
      if (typeof metric.value === 'string') return Number(metric.value) || 0;
    }
    return 0;
  }

  function metricPercent(metric) {
    if (metric && typeof metric === 'object' && metric.percent != null) return String(metric.percent);
    return '';
  }

  function formatMetric(metric) {
    const value = metricValue(metric);
    const percent = metricPercent(metric);
    return '<span>' + numberFmt.format(value) + '</span>' + (percent ? '<span class="pct">' + safe(percent) + '%</span>' : '');
  }

  function formatBytes(bytes) {
    const value = Number(bytes) || 0;
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let size = value;
    let i = 0;
    while (size >= 1024 && i < units.length - 1) {
      size /= 1024;
      i += 1;
    }
    return byteFmt.format(size) + ' ' + units[i];
  }

  function addCard(label, value) {
    const node = document.createElement('article');
    node.className = 'card';
    node.innerHTML = '<small>' + safe(label) + '</small><strong>' + safe(value) + '</strong>';
    el.cards.appendChild(node);
  }

  function addTable(title, dataset, limit) {
    if (!dataset || !Array.isArray(dataset.data) || dataset.data.length === 0) return;
    const rows = dataset.data.slice(0, limit || 20).map(function (row) {
      const methodProtocol = [row.method, row.protocol].filter(Boolean).join(' ') || '—';
      const item = row._itemText || row.data || '—';
      return '<tr>' +
        '<td class="mono">' + safe(item) + '</td>' +
        '<td>' + formatMetric(row.hits) + '</td>' +
        '<td>' + formatMetric(row.visitors) + '</td>' +
        '<td>' + formatMetric(row.bytes) + '</td>' +
        '<td class="mono">' + safe(methodProtocol) + '</td>' +
      '</tr>';
    }).join('');

    const panel = document.createElement('section');
    panel.className = 'panel';
    panel.innerHTML = '<h2>' + safe(title) + '</h2>' +
      '<div class="table-wrap"><table>' +
      '<thead><tr><th>Item</th><th>Hits</th><th>Visitors</th><th>Bytes</th><th>Method / Protocol</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>';
    el.sections.appendChild(panel);
  }

  function isIPv4(value) {
    return /^(\d{1,3}\.){3}\d{1,3}$/.test(value || '');
  }

  function codeToFlagEmoji(code) {
    if (!/^[A-Z]{2}$/.test(code)) return '🏳️';
    return String.fromCodePoint(...code.split('').map(function (c) { return 127397 + c.charCodeAt(0); }));
  }

  async function lookupCountryCode(ip) {
    if (!isIPv4(ip)) return null;
    if (flagCache.has(ip)) return flagCache.get(ip);

    const controller = new AbortController();
    const timeout = setTimeout(function () { controller.abort(); }, 1200);

    try {
      const resp = await fetch('https://ipwho.is/' + encodeURIComponent(ip), {
        cache: 'force-cache',
        signal: controller.signal
      });
      if (!resp.ok) {
        flagCache.set(ip, null);
        return null;
      }
      const data = await resp.json();
      const code = data && data.success && data.country_code ? String(data.country_code).toUpperCase() : null;
      flagCache.set(ip, code);
      return code;
    } catch (_) {
      flagCache.set(ip, null);
      return null;
    } finally {
      clearTimeout(timeout);
    }
  }

  async function addHostFlags(hostsDataset) {
    if (!hostsDataset || !Array.isArray(hostsDataset.data)) return;
    const rows = hostsDataset.data.slice(0, 20);
    await Promise.all(rows.map(async function (row) {
      const ip = String(row.data || '');
      const code = await lookupCountryCode(ip);
      const flag = codeToFlagEmoji(code || '');
      row._itemText = (code ? (flag + ' ' + code + ' ') : (flag + ' ')) + ip;
    }));
  }

  async function fetchJsonSafely(url) {
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) return { ok: false, error: url + ': HTTP ' + res.status };
      const body = await res.text();
      const trimmed = body.trimStart();
      if (!trimmed) return { ok: false, error: url + ': Empty response body' };
      if (trimmed[0] === '<') return { ok: false, error: url + ': Received HTML instead of JSON' };
      try { return { ok: true, data: JSON.parse(body) }; }
      catch (_) { return { ok: false, error: url + ': Invalid JSON response' }; }
    } catch (err) {
      return { ok: false, error: url + ': Network error (' + (err && err.message ? err.message : 'unknown') + ')' };
    }
  }

  async function fetchFirstValidJson(urls) {
    const errors = [];
    for (const url of urls) {
      const result = await fetchJsonSafely(url);
      if (result.ok) return { data: result.data, errors: [] };
      errors.push(result.error);
    }
    return { data: null, errors: errors };
  }

  window.addEventListener('unhandledrejection', function (event) {
    if (event && typeof event.preventDefault === 'function') event.preventDefault();
    showMessage('Unexpected error: ' + safe(String(event.reason)));
  });

  window.addEventListener('error', function (event) {
    if (event && event.message) showMessage('Script error: ' + safe(event.message));
  });

  (async function init() {
    const result = await fetchFirstValidJson(['emote.json', './emote.json', '/stats/emote.json', '/emote.json']);
    if (!result.data) {
      el.range.textContent = 'Unable to load analytics data';
      showMessage('Could not load <code>emote.json</code>: ' + safe(result.errors.join(' | ') || 'Unknown error'));
      return;
    }

    const data = result.data;
    const g = data.general || {};
    el.range.textContent = (g.start_date || '-') + ' → ' + (g.end_date || '-') + ' • Generated ' + (g.date_time || '-');

    addCard('Total Requests', numberFmt.format(g.total_requests || 0));
    addCard('Valid Requests', numberFmt.format(g.valid_requests || 0));
    addCard('404 Not Found', numberFmt.format(g.unique_not_found || 0));
    addCard('Unique Visitors', numberFmt.format(g.unique_visitors || 0));
    addCard('Bandwidth', formatBytes(g.bandwidth || 0));

    addTable('Top Pages', data.requests || data.top_pages, 20);
    addTable('Referrers', data.referring_sites || data.referrers, 20);
    addTable('404 Errors', data.not_found, 20);
    await addHostFlags(data.hosts);
    addTable('Top Hosts (with flags)', data.hosts, 20);

    if (!el.sections.children.length) showMessage('Loaded JSON but found no compatible sections.');
    else el.message.remove();
  })();
})();
</script>
</body>
</html>
