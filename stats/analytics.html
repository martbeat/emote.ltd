<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Emote Analytics</title>
<style>
  :root { --bg:#f8fafc; --card:#fff; --text:#0f172a; --muted:#475569; --line:#e2e8f0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1020; --card:#111827; --text:#e5e7eb; --muted:#94a3b8; --line:#1f2937; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); }
  .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 12px; }
  .cards { display:grid; grid-template-columns: repeat(auto-fit,minmax(165px,1fr)); gap:10px; margin:14px 0 18px; }
  .card { background: var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .card small { color: var(--muted); display:block; margin-bottom:4px; }
  .card strong { font-size: 1.1rem; }
  .panel { background: var(--card); border:1px solid var(--line); border-radius:10px; margin-top:14px; overflow:hidden; }
  .panel h2 { margin:0; padding:10px 12px; border-bottom:1px solid var(--line); font-size:1rem; }
  .table-wrap { overflow:auto; }
  table { width:100%; min-width:520px; border-collapse: collapse; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; }
  th { color: var(--muted); font-size: .85rem; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:.92em; }
  .pct { color: var(--muted); margin-left: 6px; font-size: .84em; }
  .message { margin-top: 12px; padding: 10px 12px; border:1px dashed var(--line); border-radius:10px; background:var(--card); color:var(--muted); }
  .subitem { color: var(--muted); font-size: .86em; margin-left: 8px; }
</style>
</head>
<body>
<main class="container">
  <h1>Emote Analytics</h1>
  <div id="range" class="sub">Loading analytics…</div>
  <div id="message" class="message">Loading <code>emote.json</code>…</div>
  <section id="cards" class="cards"></section>
  <section id="sections"></section>
  <noscript><div class="message">JavaScript is disabled; analytics requires JavaScript.</div></noscript>
</main>

<script>
(function () {
  const el = {
    range: document.getElementById('range'),
    cards: document.getElementById('cards'),
    sections: document.getElementById('sections'),
    message: document.getElementById('message')
  };

  const numberFmt = new Intl.NumberFormat();
  const byteFmt = new Intl.NumberFormat(undefined, { maximumFractionDigits: 1 });

  function safe(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  function showMessage(text) { el.message.innerHTML = text; }

  function metricValue(metric) {
    if (metric == null) return 0;
    if (typeof metric === 'number') return metric;
    if (typeof metric === 'string') return Number(metric) || 0;
    if (typeof metric === 'object') {
      if (typeof metric.count === 'number') return metric.count;
      if (typeof metric.count === 'string') return Number(metric.count) || 0;
      if (metric.count && typeof metric.count.value === 'number') return metric.count.value;
      if (metric.count && typeof metric.count.value === 'string') return Number(metric.count.value) || 0;
      if (typeof metric.value === 'number') return metric.value;
      if (typeof metric.value === 'string') return Number(metric.value) || 0;
    }
    return 0;
  }

  function metricPercent(metric) {
    if (metric && typeof metric === 'object' && metric.percent != null) return String(metric.percent);
    return '';
  }

  function formatMetric(metric) {
    const value = metricValue(metric);
    const percent = metricPercent(metric);
    return '<span>' + numberFmt.format(value) + '</span>' + (percent ? '<span class="pct">' + safe(percent) + '%</span>' : '');
  }

  function formatBytes(bytes) {
    const value = Number(bytes) || 0;
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let size = value;
    let i = 0;
    while (size >= 1024 && i < units.length - 1) {
      size /= 1024;
      i += 1;
    }
    return byteFmt.format(size) + ' ' + units[i];
  }

  function addCard(label, value) {
    const node = document.createElement('article');
    node.className = 'card';
    node.innerHTML = '<small>' + safe(label) + '</small><strong>' + safe(value) + '</strong>';
    el.cards.appendChild(node);
  }


  function hostLocationLabel(row) {
    if (!row || typeof row !== 'object') return '';
    const city = row.city || (row.geoip && row.geoip.city) || (row.location && row.location.city) || '';
    const country = row.country || (row.geoip && row.geoip.country) || (row.location && row.location.country) || '';
    const parts = [city, country].filter(Boolean).map(String);
    return parts.join(', ');
  }

  function rowItemText(row) {
    if (!row || typeof row !== 'object') return '';
    return row._itemText || row.data || row.item || row.path || row.url || row.file || row.filename || row.name || '';
  }

  function datasetRows(dataset) {
    if (!dataset) return [];
    if (Array.isArray(dataset)) return dataset;
    if (Array.isArray(dataset.data)) return dataset.data;
    if (Array.isArray(dataset.items)) return dataset.items;
    if (Array.isArray(dataset.rows)) return dataset.rows;
    return [];
  }

  function normalizeDataset(dataset) {
    const rows = datasetRows(dataset);
    return rows.length ? { data: rows } : null;
  }

  function rowMetric(row, primaryKey, fallbackKeys) {
    if (!row || typeof row !== 'object') return 0;
    const keys = [primaryKey].concat(fallbackKeys || []);
    for (let i = 0; i < keys.length; i += 1) {
      const key = keys[i];
      if (!key) continue;
      const value = metricValue(row[key]);
      if (value) return value;
    }
    return 0;
  }

  function addTable(title, dataset, limit) {
    const normalized = normalizeDataset(dataset);
    if (!normalized) return;
    const rows = normalized.data.slice(0, limit || 20).map(function (row) {
      const methodProtocol = [row.method, row.protocol].filter(Boolean).join(' ') || '—';
      const item = rowItemText(row) || '—';
      const isHostsTable = title === 'Top Hosts';
      const hostLocation = isHostsTable ? hostLocationLabel(row) : '';
      const itemHtml = safe(item) + (hostLocation ? '<span class="subitem">' + safe(hostLocation) + '</span>' : '');
      return '<tr>' +
        '<td class="mono">' + itemHtml + '</td>' +
        '<td>' + formatMetric(rowMetric(row, 'hits', ['downloads', 'requests', 'count', 'value'])) + '</td>' +
        '<td>' + formatMetric(rowMetric(row, 'visitors', ['unique_visitors', 'users'])) + '</td>' +
        '<td>' + formatMetric(rowMetric(row, 'bytes', ['bandwidth', 'size'])) + '</td>' +
        '<td class="mono">' + safe(methodProtocol) + '</td>' +
      '</tr>';
    }).join('');

    const panel = document.createElement('section');
    panel.className = 'panel';
    panel.innerHTML = '<h2>' + safe(title) + '</h2>' +
      '<div class="table-wrap"><table>' +
      '<thead><tr><th>Item</th><th>Hits</th><th>Visitors</th><th>Bytes</th><th>Method / Protocol</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>';
    el.sections.appendChild(panel);
  }

  function firstNumber(value) {
    if (typeof value === 'number' && Number.isFinite(value)) return value;
    if (typeof value !== 'string') return NaN;
    const match = value.match(/\b(\d{3})\b/);
    return match ? Number(match[1]) : NaN;
  }

  function getStatusCode(row) {
    if (!row || typeof row !== 'object') return NaN;
    const candidates = [
      row.status,
      row.status_code,
      row.statusCode,
      row.http_status,
      row.response_code,
      row.code
    ];
    for (let i = 0; i < candidates.length; i += 1) {
      const code = firstNumber(candidates[i]);
      if (!Number.isNaN(code)) return code;
    }
    return firstNumber(row.data || row._itemText || '');
  }

  function groupedLocationTable(hostsDataset, bucket) {
    const normalizedHosts = normalizeDataset(hostsDataset);
    if (!normalizedHosts) return null;
    const grouped = new Map();

    normalizedHosts.data.forEach(function (row) {
      const statusCode = getStatusCode(row);
      const inSuccessBucket = statusCode >= 200 && statusCode < 400;
      const inErrorBucket = statusCode >= 400;
      const include = bucket === 'success' ? inSuccessBucket : inErrorBucket;
      if (!include) return;

      const location = hostLocationLabel(row) || 'Unknown location';
      const entry = grouped.get(location) || { data: location, hits: 0, visitors: 0, bytes: 0 };
      entry.hits += rowMetric(row, 'hits', ['downloads', 'requests', 'count', 'value']);
      entry.visitors += rowMetric(row, 'visitors', ['unique_visitors', 'users']);
      entry.bytes += rowMetric(row, 'bytes', ['bandwidth', 'size']);
      grouped.set(location, entry);
    });

    const rows = Array.from(grouped.values()).sort(function (a, b) {
      return rowMetric(b, 'hits', ['downloads', 'requests', 'count', 'value']) - rowMetric(a, 'hits', ['downloads', 'requests', 'count', 'value']);
    });
    return rows.length ? { data: rows } : null;
  }

  function isPdfPath(value) {
    if (typeof value !== 'string') return false;
    return /\.pdf(?:$|[?#])/i.test(value.trim());
  }

  function buildPdfDownloadsDataset(sourceDataset) {
    const normalized = normalizeDataset(sourceDataset);
    if (!normalized) return null;

    const rows = normalized.data.filter(function (row) {
      const item = rowItemText(row);
      return isPdfPath(item);
    }).sort(function (a, b) {
      return rowMetric(b, 'hits', ['downloads', 'requests', 'count', 'value']) - rowMetric(a, 'hits', ['downloads', 'requests', 'count', 'value']);
    });

    return rows.length ? { data: rows } : null;
  }

  function datasetTotal(dataset, field) {
    const normalized = normalizeDataset(dataset);
    if (!normalized) return 0;
    return normalized.data.reduce(function (sum, row) {
      return sum + rowMetric(row, field, field === 'hits' ? ['downloads', 'requests', 'count', 'value'] : []);
    }, 0);
  }

  function rowCountry(row) {
    if (!row || typeof row !== 'object') return '';
    return String(row.country || (row.geoip && row.geoip.country) || (row.location && row.location.country) || '').trim();
  }

  function rowCity(row) {
    if (!row || typeof row !== 'object') return '';
    return String(row.city || (row.geoip && row.geoip.city) || (row.location && row.location.city) || '').trim();
  }

  function buildPdfLocationDataset(pdfDataset, dimension) {
    const normalized = normalizeDataset(pdfDataset);
    if (!normalized) return null;

    const grouped = new Map();
    normalized.data.forEach(function (row) {
      const country = rowCountry(row);
      const city = rowCity(row);
      const key = dimension === 'city'
        ? ([city, country].filter(Boolean).join(', ') || 'Unknown city')
        : (country || 'Unknown country');

      const entry = grouped.get(key) || { data: key, hits: 0, visitors: 0, bytes: 0 };
      entry.hits += rowMetric(row, 'hits', ['downloads', 'requests', 'count', 'value']);
      entry.visitors += rowMetric(row, 'visitors', ['unique_visitors', 'users']);
      entry.bytes += rowMetric(row, 'bytes', ['bandwidth', 'size']);
      grouped.set(key, entry);
    });

    const rows = Array.from(grouped.values()).sort(function (a, b) {
      return rowMetric(b, 'hits', ['downloads', 'requests', 'count', 'value']) - rowMetric(a, 'hits', ['downloads', 'requests', 'count', 'value']);
    });
    return rows.length ? { data: rows } : null;
  }

  function isPdfPath(value) {
    if (typeof value !== 'string') return false;
    return /\.pdf(?:$|[?#])/i.test(value.trim());
  }

  function buildPdfDownloadsDataset(sourceDataset) {
    const normalized = normalizeDataset(sourceDataset);
    if (!normalized) return null;

    const rows = normalized.data.filter(function (row) {
      const item = rowItemText(row);
      return isPdfPath(item);
    }).sort(function (a, b) {
      return rowMetric(b, 'hits', ['downloads', 'requests', 'count', 'value']) - rowMetric(a, 'hits', ['downloads', 'requests', 'count', 'value']);
    });

    return rows.length ? { data: rows } : null;
  }

  function datasetTotal(dataset, field) {
    const normalized = normalizeDataset(dataset);
    if (!normalized) return 0;
    return normalized.data.reduce(function (sum, row) {
      return sum + rowMetric(row, field, field === 'hits' ? ['downloads', 'requests', 'count', 'value'] : []);
    }, 0);
  }

  function rowCountry(row) {
    if (!row || typeof row !== 'object') return '';
    return String(row.country || (row.geoip && row.geoip.country) || (row.location && row.location.country) || '').trim();
  }

  function rowCity(row) {
    if (!row || typeof row !== 'object') return '';
    return String(row.city || (row.geoip && row.geoip.city) || (row.location && row.location.city) || '').trim();
  }

  function buildPdfLocationDataset(pdfDataset, dimension) {
    const normalized = normalizeDataset(pdfDataset);
    if (!normalized) return null;

    const grouped = new Map();
    normalized.data.forEach(function (row) {
      const country = rowCountry(row);
      const city = rowCity(row);
      const key = dimension === 'city'
        ? [city, country].filter(Boolean).join(', ')
        : country;
      if (!key) return;

      const entry = grouped.get(key) || { data: key, hits: 0, visitors: 0, bytes: 0 };
      entry.hits += rowMetric(row, 'hits', ['downloads', 'requests', 'count', 'value']);
      entry.visitors += rowMetric(row, 'visitors', ['unique_visitors', 'users']);
      entry.bytes += rowMetric(row, 'bytes', ['bandwidth', 'size']);
      grouped.set(key, entry);
    });

    const rows = Array.from(grouped.values()).sort(function (a, b) {
      return rowMetric(b, 'hits', ['downloads', 'requests', 'count', 'value']) - rowMetric(a, 'hits', ['downloads', 'requests', 'count', 'value']);
    });
    return rows.length ? { data: rows } : null;
  }

  function isPdfPath(value) {
    if (typeof value !== 'string') return false;
    return /\.pdf(?:$|[?#])/i.test(value.trim());
  }

  function buildPdfDownloadsDataset(sourceDataset) {
    const normalized = normalizeDataset(sourceDataset);
    if (!normalized) return null;

    const rows = normalized.data.filter(function (row) {
      const item = rowItemText(row);
      return isPdfPath(item);
    }).sort(function (a, b) {
      return rowMetric(b, 'hits', ['downloads', 'requests', 'count', 'value']) - rowMetric(a, 'hits', ['downloads', 'requests', 'count', 'value']);
    });

    return rows.length ? { data: rows } : null;
  }

  function datasetTotal(dataset, field) {
    const normalized = normalizeDataset(dataset);
    if (!normalized) return 0;
    return normalized.data.reduce(function (sum, row) {
      return sum + rowMetric(row, field, field === 'hits' ? ['downloads', 'requests', 'count', 'value'] : []);
    }, 0);
  }


  async function fetchJsonSafely(url) {
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) return { ok: false, error: url + ': HTTP ' + res.status };
      const body = await res.text();
      const trimmed = body.trimStart();
      if (!trimmed) return { ok: false, error: url + ': Empty response body' };
      if (trimmed[0] === '<') return { ok: false, error: url + ': Received HTML instead of JSON' };
      try { return { ok: true, data: JSON.parse(body) }; }
      catch (_) { return { ok: false, error: url + ': Invalid JSON response' }; }
    } catch (err) {
      return { ok: false, error: url + ': Network error (' + (err && err.message ? err.message : 'unknown') + ')' };
    }
  }

  async function fetchFirstValidJson(urls) {
    const errors = [];
    for (const url of urls) {
      const result = await fetchJsonSafely(url);
      if (result.ok) return { data: result.data, errors: [] };
      errors.push(result.error);
    }
    return { data: null, errors: errors };
  }

  window.addEventListener('unhandledrejection', function (event) {
    if (event && typeof event.preventDefault === 'function') event.preventDefault();
    showMessage('Unexpected error: ' + safe(String(event.reason)));
  });

  window.addEventListener('error', function (event) {
    if (event && event.message) showMessage('Script error: ' + safe(event.message));
  });

  (async function init() {
    const result = await fetchFirstValidJson(['emote.json', './emote.json', '/stats/emote.json', '/emote.json']);
    if (!result.data) {
      el.range.textContent = 'Unable to load analytics data';
      showMessage('Could not load <code>emote.json</code>: ' + safe(result.errors.join(' | ') || 'Unknown error'));
      return;
    }

    const data = result.data;
    const g = data.general || {};
    el.range.textContent = (g.start_date || '-') + ' → ' + (g.end_date || '-') + ' • Generated ' + (g.date_time || '-');

    addCard('Total Requests', numberFmt.format(g.total_requests || 0));
    addCard('Valid Requests', numberFmt.format(g.valid_requests || 0));
    addCard('404 Not Found', numberFmt.format(g.unique_not_found || 0));
    addCard('Unique Visitors', numberFmt.format(g.unique_visitors || 0));
    addCard('Bandwidth', formatBytes(g.bandwidth || 0));

    const pdfDownloads = normalizeDataset(data.pdf_downloads || data.downloads) || buildPdfDownloadsDataset(data.static_requests || data.requests || data.top_pages);
    addCard('PDF Downloads', numberFmt.format(datasetTotal(pdfDownloads, 'hits')));

    addTable('Top Pages', data.requests || data.top_pages, 20);
    addTable('Referrers', data.referring_sites || data.referrers, 20);
    addTable('404 Errors', data.not_found, 20);
    addTable('PDF Downloads', pdfDownloads, 20);
    addTable('PDF Downloads by Country', buildPdfLocationDataset(pdfDownloads, 'country'), 20);
    addTable('PDF Downloads by City', buildPdfLocationDataset(pdfDownloads, 'city'), 20);
    addTable('Top Hosts', data.hosts, 20);

    const successfulLocations = groupedLocationTable(data.hosts, 'success');
    const errorLocations = groupedLocationTable(data.hosts, 'error');
    addTable('Visitor Locations (Successful Requests)', successfulLocations, 20);
    addTable('Suspicious Locations (4xx/5xx Errors)', errorLocations, 20);

    if (!el.sections.children.length) showMessage('Loaded JSON but found no compatible sections.');
    else el.message.remove();
  })();
})();
</script>
</body>
</html>
