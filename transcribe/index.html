interval = setInterval(async () => {

      { cache: "no-store" }
    );

    const t = await r.text();

    console.log("Status response:", t.substring(0,100));

    // ✅ DEFINE cleaned properly
    let cleaned = t
      .replace(/^DONE\s*/,'')
      .replace(/^PROCESSING\s*/,'')
      .replace(/No chunks yet\.\n?/g,'');

    // ✅ always update UI
    out.textContent = cleaned + "\n\n(last update: " + new Date().toLocaleTimeString() + ")";

    // ✅ stop when complete
    if (t.startsWith("DONE")) {
      console.log("Job complete");
      clearInterval(interval);
      interval = null;
    }

  } catch (err) {
    console.error("Polling error:", err);
  }

}, 3000);

    console.error("Upload error:", err);
    out.textContent = "Upload failed.";
  }
}
