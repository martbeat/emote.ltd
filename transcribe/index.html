<!DOCTYPE html>
<html>
<head>
    <title>Transcribe</title>
</head>
<body>

<h2>Upload audio for transcription</h2>

<input type="file" id="file">
<button onclick="go()">Transcribe</button>

<pre id="result" style="background:#eee;padding:10px;"></pre>

<script>
async function go() {
    const fileInput = document.getElementById("file");
    const result = document.getElementById("result");

    if (!fileInput.files.length) {
        alert("Choose a file");
        return;
    }

    result.innerText = "Uploading...";

    const file = fileInput.files[0];

    try {
        // --- UPLOAD ---
        const upload = await fetch("/transcribe", {
            method: "POST",
            body: file
        });

        const jobId = (await upload.text()).trim();

        console.log("JOB ID:", jobId);

        if (!jobId || jobId.length < 10) {
            result.innerText = "Upload failed:\n" + jobId;
            return;
        }

        result.innerText = "Processing...";

        // --- POLLING ---
        const poll = setInterval(async () => {
            try {
                const res = await fetch(`/transcribe-status?${jobId}&t=${Date.now()}`);
                const text = await res.text();

                console.log("STATUS:\n", text);

                // --- DONE ---
                if (text.startsWith("DONE")) {
                    clearInterval(poll);

                    result.innerText = text.replace(/^DONE\s*/, '');
                    return;
                }

                // --- PROCESSING ---
                result.innerText = text;

            } catch (e) {
                console.error("Polling error:", e);
                result.innerText = "Polling error... retrying";
            }

        }, 3000);

    } catch (e) {
        result.innerText = "Upload error: " + e;
    }
}
</script>

</body>
</html>
