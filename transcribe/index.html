<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Transcribe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
            max-width: 950px;
        }

        h2 {
            margin-bottom: 12px;
        }

        .controls {
            margin-bottom: 16px;
        }

        button {
            margin: 4px 4px 4px 0;
            padding: 6px 12px;
            cursor: pointer;
        }

        #status {
            margin: 12px 0;
            font-weight: bold;
        }

        #job-info {
            margin: 8px 0 12px 0;
            color: #555;
            font-size: 0.95em;
        }

        #progress-wrap {
            width: 100%;
            background: #e5e5e5;
            border-radius: 8px;
            overflow: hidden;
            height: 22px;
            margin: 8px 0 16px 0;
            display: none;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: #555;
            color: white;
            text-align: center;
            line-height: 22px;
            font-size: 13px;
            transition: width 0.3s ease;
        }

        .transcript-tools {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 0 6px 0;
        }

        .transcript-tools span {
            color: #555;
            font-size: 0.9em;
        }

        #result {
            box-sizing: border-box;
            width: 100%;
            min-height: 320px;
            padding: 14px;
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 6px;
            font: 16px/1.5 Arial, sans-serif;
            resize: vertical;
            white-space: pre-wrap;
        }

        #copy-feedback {
            min-height: 1em;
        }

        .hint {
            color: #555;
            font-size: 0.9em;
            margin-top: 8px;
        }

        #recent-jobs {
            margin-top: 20px;
            font-size: 0.9em;
        }

        #recent-jobs ul {
            padding-left: 18px;
        }

        #recent-jobs li {
            margin-bottom: 5px;
        }

        .small {
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<h2>Upload audio for transcription</h2>

<div class="controls">
    <input type="file" id="file" accept="audio/*">
    <button onclick="go()">Transcribe</button>
    <button onclick="resumeLatestJob()">Resume latest job</button>
    <button onclick="clearCurrentJob()">Clear current job</button>
</div>

<div id="status">Waiting...</div>
<div id="job-info"></div>

<div id="progress-wrap">
    <div id="progress-bar">0%</div>
</div>

<div class="transcript-tools">
    <button onclick="copyTranscript()">Copy transcript</button>
    <button onclick="selectTranscript()">Select all text</button>
    <span id="copy-feedback" aria-live="polite"></span>
</div>

<textarea id="result" readonly spellcheck="false" placeholder="Transcript text will appear here. Use the buttons above, or click in this box and press Ctrl/Cmd+A to select all."></textarea>

<div class="hint">
    Longer files may take several minutes on the Raspberry Pi. If you refresh this page, the latest job should resume automatically.
</div>

<div id="recent-jobs">
    <strong>Recent jobs</strong>
    <ul id="recent-list"></ul>
</div>

<script>
let pollTimer = null;

const STORAGE_ACTIVE_JOB = "transcribe.activeJobId";
const STORAGE_RECENT_JOBS = "transcribe.recentJobs";

function setResultText(text) {
    document.getElementById("result").value = text;
    document.getElementById("copy-feedback").innerText = "";
}

function selectTranscript() {
    const result = document.getElementById("result");

    result.focus();
    result.select();
}

async function copyTranscript() {
    const result = document.getElementById("result");
    const feedback = document.getElementById("copy-feedback");
    const text = result.value;

    if (!text) {
        feedback.innerText = "Nothing to copy yet.";
        return;
    }

    try {
        await navigator.clipboard.writeText(text);
        feedback.innerText = "Copied.";
    } catch (err) {
        selectTranscript();
        feedback.innerText = "Copy failed. Text selected so you can press Ctrl/Cmd+C.";
    }
}

function saveActiveJob(jobId, filename = "") {
    localStorage.setItem(STORAGE_ACTIVE_JOB, jobId);

    if (filename) {
        localStorage.setItem("transcribe.activeFilename", filename);
    }

    addRecentJob(jobId, filename);
}

function getActiveJob() {
    return localStorage.getItem(STORAGE_ACTIVE_JOB) || "";
}

function clearActiveJob() {
    localStorage.removeItem(STORAGE_ACTIVE_JOB);
}

function getRecentJobs() {
    try {
        return JSON.parse(localStorage.getItem(STORAGE_RECENT_JOBS) || "[]");
    } catch {
        return [];
    }
}

function saveRecentJobs(jobs) {
    localStorage.setItem(STORAGE_RECENT_JOBS, JSON.stringify(jobs.slice(0, 10)));
}

function addRecentJob(jobId, filename = "") {
    let jobs = getRecentJobs();

    const existing = jobs.find(j => j.id === jobId);

    if (!filename && existing && existing.filename) {
        filename = existing.filename;
    }

    jobs = jobs.filter(j => j.id !== jobId);

    jobs.unshift({
        id: jobId,
        filename: filename || "(unknown file)",
        started: existing?.started || new Date().toLocaleString()
    });

    saveRecentJobs(jobs);
    renderRecentJobs();
}

function renderRecentJobs() {
    const list = document.getElementById("recent-list");
    const jobs = getRecentJobs();

    list.innerHTML = "";

    if (!jobs.length) {
        const li = document.createElement("li");
        li.textContent = "No recent jobs saved in this browser.";
        list.appendChild(li);
        return;
    }

    jobs.forEach(job => {
        const li = document.createElement("li");

        const openButton = document.createElement("button");
        openButton.textContent = "Open";
        openButton.className = "small";
        openButton.onclick = () => startPolling(job.id);

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete link";
        deleteButton.className = "small";
        deleteButton.onclick = () => deleteRecentJob(job.id);

        const span = document.createElement("span");

        const filename = job.filename || "(unknown file)";
        const started = job.started || "unknown time";

        span.textContent =
            " " + filename +
            " — " + started +
            " — " + job.id;

        li.appendChild(openButton);
        li.appendChild(deleteButton);
        li.appendChild(span);
        list.appendChild(li);
    });
}
function parseStatusResponse(text) {
    const lines = text.split(/\r?\n/);

    let status = "UNKNOWN";
    let current = 0;
    let total = 0;
    let bodyStart = 0;

    for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        if (line.startsWith("STATUS:")) {
            status = line.substring("STATUS:".length).trim();
            continue;
        }

        if (line.startsWith("CURRENT:")) {
            current = parseInt(line.substring("CURRENT:".length).trim(), 10) || 0;
            continue;
        }

        if (line.startsWith("TOTAL:")) {
            total = parseInt(line.substring("TOTAL:".length).trim(), 10) || 0;
            continue;
        }

        if (line.trim() === "") {
            bodyStart = i + 1;
            break;
        }
    }

    const body = lines.slice(bodyStart).join("\n").trim();

    return { status, current, total, body };
}

function updateProgress(current, total, status) {
    const wrap = document.getElementById("progress-wrap");
    const bar = document.getElementById("progress-bar");

    wrap.style.display = "block";

    let percent = 0;

    if (total > 0) {
        percent = Math.min(100, Math.round((current / total) * 100));
    } else if (status === "PROCESSING") {
        percent = 5;
    } else if (status === "DONE") {
        percent = 100;
    }

    bar.style.width = percent + "%";
    bar.innerText = percent + "%";
}

async function go() {
    const fileInput = document.getElementById("file");
    const statusBox = document.getElementById("status");

    if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
    }

    if (!fileInput.files.length) {
        statusBox.innerText = "Please select a file.";
        return;
    }

    const file = fileInput.files[0];

    statusBox.innerText = "Uploading...";
    setResultText("");
    document.getElementById("job-info").innerText = "";

    updateProgress(0, 0, "PROCESSING");

    let jobId = "";

    try {
        const upload = await fetch("/transcribe", {
            method: "POST",
            body: file
        });

        jobId = (await upload.text()).trim();

        if (!jobId || jobId.length < 10 || jobId.includes("<")) {
            statusBox.innerText = "Upload failed: invalid job ID returned.";
            setResultText(jobId);
            return;
        }

    } catch (err) {
        statusBox.innerText = "Upload failed.";
        setResultText(String(err));
        return;
    }

    saveActiveJob(jobId, file.name);
    startPolling(jobId);
}

function resumeLatestJob() {
    const jobId = getActiveJob();

    if (!jobId) {
        document.getElementById("status").innerText = "No saved active job found in this browser.";
        return;
    }

    startPolling(jobId);
}

function clearCurrentJob() {
    if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
    }

    clearActiveJob();

    document.getElementById("status").innerText = "Current job cleared.";
    document.getElementById("job-info").innerText = "";
    setResultText("");
    document.getElementById("progress-wrap").style.display = "none";
}

function startPolling(jobId) {
    const statusBox = document.getElementById("status");
    const jobInfo = document.getElementById("job-info");

    if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
    }

    saveActiveJob(jobId);

    statusBox.innerText = "Resuming job...";

    const recent = getRecentJobs().find(j => j.id === jobId);
    const filename = recent?.filename || localStorage.getItem("transcribe.activeFilename") || "";

    jobInfo.innerText = filename
        ? "File: " + filename + " | Job ID: " + jobId
        : "Job ID: " + jobId;

    async function poll() {
        try {
            const res = await fetch(
                "/transcribe-status?ID=" + encodeURIComponent(jobId) + "&nocache=" + Date.now(),
                { cache: "no-store" }
            );

            const raw = await res.text();
            const parsed = parseStatusResponse(raw);

            updateProgress(parsed.current, parsed.total, parsed.status);

            if (parsed.status === "PROCESSING") {
                if (parsed.total > 0) {
                    statusBox.innerText =
                        "Processing: " + parsed.current + " of " + parsed.total + " chunks complete";
                } else {
                    statusBox.innerText = "Preparing audio...";
                }

                setResultText(parsed.body || "Preparing audio and looking for pauses...");
                return;
            }

            if (parsed.status === "DONE") {
                statusBox.innerText = "Complete";
                updateProgress(parsed.total || 1, parsed.total || 1, "DONE");
                setResultText(parsed.body || "(completed but no transcript was produced)");

                clearInterval(pollTimer);
                pollTimer = null;

                // Keep the job saved so refresh still shows it,
                // but it is no longer actively polling.
                saveActiveJob(jobId);
                return;
            }

            if (parsed.status === "ERROR") {
                statusBox.innerText = "Error";
                setResultText(parsed.body || raw);

                clearInterval(pollTimer);
                pollTimer = null;
                return;
            }

            statusBox.innerText = "Unknown response";
            setResultText(raw);

        } catch (err) {
            statusBox.innerText = "Polling error, retrying...";
            console.error(err);
        }
    }

    poll();
    pollTimer = setInterval(poll, 3000);
}

function deleteRecentJob(jobId) {
    let jobs = getRecentJobs();

    jobs = jobs.filter(j => j.id !== jobId);
    saveRecentJobs(jobs);

    if (getActiveJob() === jobId) {
        clearActiveJob();
        localStorage.removeItem("transcribe.activeFilename");

        if (pollTimer) {
            clearInterval(pollTimer);
            pollTimer = null;
        }

        document.getElementById("status").innerText = "Deleted saved job link.";
        document.getElementById("job-info").innerText = "";
        setResultText("");
        document.getElementById("progress-wrap").style.display = "none";
    }

    renderRecentJobs();
}
    
window.addEventListener("load", () => {
    renderRecentJobs();

    const activeJob = getActiveJob();

    if (activeJob) {
        document.getElementById("status").innerText =
            "Found saved job. Resuming...";
        startPolling(activeJob);
    }
});
</script>

</body>
</html>
