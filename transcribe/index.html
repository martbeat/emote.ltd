<!DOCTYPE html>
<html>
<head>
  <title>Transcription</title>
</head>
<body>

<h2>Upload audio for transcription</h2>

<input type="file" id="file">
<button onclick="go()">Transcribe</button>

<pre id="out">Waiting...</pre>

<script>
let interval = null;

async function go() {

  // Clear any previous polling
  if (interval) {
    clearInterval(interval);
  }

  const out = document.getElementById("out");
  const fileInput = document.getElementById("file");

  if (!fileInput.files.length) {
    out.textContent = "Please select a file.";
    return;
  }

  const file = fileInput.files[0];

  out.textContent = "Uploading...";

  try {

    const res = await fetch("/transcribe", {
      method: "POST",
      body: file
    });

    const text = (await res.text()).trim();

    // Validate UUID (prevents 504 HTML breaking everything)
    if (!text.match(/^[a-f0-9-]{36}$/)) {
      out.textContent = "Upload failed (no valid job ID returned)";
      console.error("Bad response:", text);
      return;
    }

    const id = text;

    out.textContent = "Job started: " + id;

    // Start polling
    interval = setInterval(async () => {

      try {

        const r = await fetch(
          "/transcribe-status?" + encodeURIComponent(id) + "&_=" + Date.now(),
          { cache: "no-store" }
        );

        const t = await r.text();

        // Display output (remove DONE header if present)
        out.textContent = t.replace(/^DONE\s*/, "");

        // Stop when complete
        if (t.startsWith("DONE")) {
          clearInterval(interval);
          interval = null;
        }

      } catch (err) {
        console.error("Polling error:", err);
        out.textContent = "Connection issue while polling...";
      }

    }, 3000);

  } catch (err) {
    console.error("Upload error:", err);
    out.textContent = "Upload failed.";
  }
}
</script>

</body>
</html>
