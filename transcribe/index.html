<!DOCTYPE html>
<html>
<head>
    <title>Transcribe</title>
</head>
<body>

<h2>Upload audio for transcription</h2>

<input type="file" id="file">
<button onclick="go()">Transcribe</button>

<pre id="result">Waiting...</pre>

<script>
async function go() {
    const fileInput = document.getElementById('file');
    const result = document.getElementById('result');

    if (!fileInput.files.length) {
        alert("Select a file first");
        return;
    }

    result.innerText = "Uploading...";

    const file = fileInput.files[0];

    const response = await fetch('/transcribe', {
        method: 'POST',
        body: file
    });

    const id = (await response.text()).trim();

    result.innerText = "Job ID: " + id + "\nStarting...";

    let lastText = "";
    let stableCount = 0;

    const poll = setInterval(async () => {
        try {
            const r = await fetch('/transcribe-status?' + id + '&nocache=' + Date.now());
            const t = await r.text();

            // remove DONE label for display
            const cleaned = t.replace(/DONE\s*/g, '').trim();

            result.innerText = cleaned;

            // --- stability check ---
            if (cleaned === lastText) {
                stableCount++;
            } else {
                stableCount = 0;
            }

            lastText = cleaned;

            // --- only stop when stable ---
            if (stableCount >= 3 && t.includes("DONE")) {
                clearInterval(poll);
            }

        } catch (err) {
            console.log("Polling error:", err);
        }

    }, 3000);
}
</script>
</body>
</html>
