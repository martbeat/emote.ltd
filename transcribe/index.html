<!DOCTYPE html>
<html>
<head>
    <title>Transcribe</title>
</head>
<body>

<h2>Upload audio for transcription</h2>

<input type="file" id="file">
<button onclick="go()">Transcribe</button>

<pre id="result">Waiting...</pre>

<script>
async function go() {
    console.log("GO clicked");

    const fileInput = document.getElementById('file');
    const result = document.getElementById('result');

    if (!fileInput.files.length) {
        alert("Select a file first");
        return;
    }

    result.innerText = "Uploading...";

    const file = fileInput.files[0];

    // --- UPLOAD ---
    let response;
    try {
        response = await fetch('/transcribe', {
            method: 'POST',
            body: file
        });
    } catch (err) {
        result.innerText = "Upload failed: " + err;
        return;
    }

    console.log("Upload response received");

    const text = await response.text();
    console.log("Raw response:", text);

    const id = text.trim();

    if (!id || id.length < 10) {
        result.innerText = "Upload failed or invalid ID:\n" + text;
        return;
    }

    result.innerText = "Job ID: " + id + "\nStarting...";

    // --- POLLING ---
    const poll = setInterval(async () => {
        console.log("Polling...");

        try {
            const r = await fetch('/transcribe-status?' + id + '&nocache=' + Date.now());
            const t = await r.text();

            console.log("Status response:", t);

            // --- DONE ---
            if (t.includes("DONE")) {
                clearInterval(poll);

                const finalText = t.replace(/DONE\s*/g, '').trim();

                result.innerText = finalText || "(DONE but empty response)";
                return;
            }

            // --- PROCESSING ---
            result.innerText = t;

        } catch (err) {
            console.log("Polling error:", err);
        }

    }, 3000);
}
</script>

</body>
</html>
