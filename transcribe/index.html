<input type="file" id="file">
<button onclick="go()">Transcribe</button>
<pre id="out"></pre>

<script>
async function go() {
  let f = document.getElementById("file").files[0];

  let res = await fetch("/transcribe", {
    method: "POST",
    body: f
  });

  let id = (await res.text()).trim();

  let interval = setInterval(async () => {
    let r = await fetch("/transcribe-status?" + id);
    let t = await r.text();

    // Always show latest output
    document.getElementById("out").textContent = t;

    // STOP when final file appears
    if (t.includes(".txt ===")) {
      clearInterval(interval);
    }

  }, 3000);
}
</script>
