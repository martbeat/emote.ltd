<!DOCTYPE html>
<html>
<head>
  <title>Transcription</title>
</head>
<body>

<h2>Upload audio for transcription</h2>

<input type="file" id="file">
<button onclick="go()">Transcribe</button>

<pre id="out">Waiting...</pre>

<script>
let interval = null;

async function go() {

  console.log("GO clicked");

  if (interval) {
    clearInterval(interval);
  }

  const out = document.getElementById("out");
  const fileInput = document.getElementById("file");

  if (!fileInput.files.length) {
    out.textContent = "Please select a file.";
    return;
  }

  const file = fileInput.files[0];

  out.textContent = "Uploading...";

  try {

    const res = await fetch("/transcribe", {
      method: "POST",
      body: file
    });

    console.log("Upload response received");

    const text = (await res.text()).trim();

    console.log("Raw response:", text);

    if (!text.match(/^[a-f0-9-]{36}$/)) {
      out.textContent = "Upload failed";
      console.error("Invalid ID:", text);
      return;
    }

    const id = text;

    out.textContent = "Job started: " + id;

    console.log("Starting polling for:", id);

    interval = setInterval(async () => {

      console.log("Polling...");

      try {

        const r = await fetch(
          "/transcribe-status?" + encodeURIComponent(id) + "&_=" + Date.now(),
          { cache: "no-store" }
        );

        const t = await r.text();

        console.log("Status response:", t.substring(0,100));

        out.textContent = t.replace(/^DONE\s*/, "");

        if (t.startsWith("DONE")) {
          console.log("Job complete");
          clearInterval(interval);
          interval = null;
        }

      } catch (err) {
        console.error("Polling error:", err);
      }

    }, 3000);

  } catch (err) {
    console.error("Upload error:", err);
    out.textContent = "Upload failed.";
  }
}
</script>

</body>
</html>
