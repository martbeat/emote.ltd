<!DOCTYPE html>
<html>
<head>
  <title>Transcription</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    pre { background: #f5f5f5; padding: 10px; white-space: pre-wrap; }
  </style>
</head>
<body>

<h2>Upload audio for transcription</h2>

<input type="file" id="file">
<button onclick="go()">Transcribe</button>

<pre id="out">Waiting...</pre>

<script>
let interval = null;

async function go() {

  console.log("GO clicked");

  // Stop previous polling if running
  if (interval) {
    clearInterval(interval);
    interval = null;
  }

  const out = document.getElementById("out");
  const fileInput = document.getElementById("file");

  if (!fileInput.files.length) {
    out.textContent = "Please select a file.";
    return;
  }

  const file = fileInput.files[0];

  out.textContent = "Uploading...";

  try {

    const res = await fetch("/transcribe", {
      method: "POST",
      body: file
    });

    console.log("Upload response received");

    const text = (await res.text()).trim();

    console.log("Raw response:", text);

    // Validate UUID (protects against 504 HTML etc.)
    if (!text.match(/^[a-f0-9-]{36}$/)) {
      out.textContent = "Upload failed (invalid response)";
      console.error("Invalid ID:", text);
      return;
    }

    const id = text;

    out.textContent = "Job started: " + id;

    console.log("Starting polling for:", id);

    // Start polling loop
    interval = setInterval(async () => {

      console.log("Polling...");

      try {

        const r = await fetch(
          "/transcribe-status?" + encodeURIComponent(id) + "&_=" + Date.now(),
          { cache: "no-store" }
        );

        const t = await r.text();

        console.log("Status response:", t.substring(0,100));

        let isDone = t.startsWith("DONE");
        
        let cleaned = t
          .replace(/^DONE\s*/,'')
          .replace(/^PROCESSING\s*/,'');
        
        // ONLY show placeholder if still processing AND nothing exists
        if (!isDone && !cleaned.trim()) {
          cleaned = "Processing… (waiting for first chunk)";
        }
        
        // Always show something if DONE
        if (isDone && !cleaned.trim()) {
          cleaned = "(completed but no text returned)";
        }
        
        out.textContent =
          cleaned + "\n\n(last update: " + new Date().toLocaleTimeString() + ")";

        // Stop polling when complete
        if (t.startsWith("DONE")) {
          console.log("Job complete");
          clearInterval(interval);
          interval = null;
        }

      } catch (err) {
        console.error("Polling error:", err);
        out.textContent = "Connection issue while polling...";
      }

    }, 3000);

  } catch (err) {
    console.error("Upload error:", err);
    out.textContent = "Upload failed.";
  }
}
</script>

</body>
</html>
